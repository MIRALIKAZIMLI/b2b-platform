openapi: 3.1.0
info:
  title: B2B Toptan–Perakende Platformu API
  version: 1.0.0
  description: |
    MVP API sözleşmesi. Bu dosya tek doğru kaynaktır; web ve mobil istemci tipleri
    bu dosyadan üretilir (packages/api-client).

    Genel kurallar:
    - Tüm uç noktalar /api/v1 altındadır. Kırıcı değişiklik yalnızca /api/v2 ile (NFR-85).
    - Kiracıya bağlı uç noktalar `X-Business-Id` başlığı ister; değer, kullanıcının aktif
      üyeliği olan bir işletme olmalıdır.
    - Para tutarları string ondalık olarak döner ("1234.50") ve her zaman para birimiyle birlikte.
    - Zamanlar ISO 8601, UTC ("2026-10-24T08:00:00Z"). Gösterim istemcinin işidir.
    - Liste uç noktaları imleç (cursor) sayfalaması kullanır: `?cursor=&limit=` (limit en fazla 100,
      varsayılan 20).
    - "Oluştur" ve durum değiştiren POST uç noktaları `Idempotency-Key` başlığını kabul eder
      (24 saat geçerli).
    - Hata yanıtı her zaman `Error` şemasıdır.
    - `Accept-Language` (az, ru, tr, en) hata mesajı ve içerik dilini belirler; yoksa kullanıcının
      tercih ettiği dil kullanılır.
servers:
  - url: https://api.example.az
    description: Production (alan adı F0.4'te belirlenecek)
  - url: https://api.staging.example.az
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: me
  - name: business
  - name: team
  - name: directory
  - name: connections
  - name: catalog
  - name: pricing
  - name: inventory
  - name: cart
  - name: orders
  - name: delivery
  - name: ledger
  - name: documents
  - name: imports
  - name: files
  - name: notifications
  - name: dashboard
  - name: system
  - name: admin
  - name: dev

paths:
  # ---------------------------------------------------------------- auth
  /api/v1/auth/otp/request:
    post:
      tags: [auth]
      summary: OTP kodu iste (US-001)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { $ref: '#/components/schemas/PhoneE164' }
                purpose: { type: string, enum: [login, register, invitation] }
      responses:
        '202':
          description: Kod gönderildi
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresAt]
                properties:
                  challengeId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      summary: OTP kodunu doğrula ve oturum aç (US-001)
      security: []
      parameters: [ { $ref: '#/components/parameters/XClient' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200':
          description: Doğrulandı. Web'de `refreshToken` gövdede yok, cookie'de.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /api/v1/auth/totp/verify:
    post:
      tags: [auth]
      summary: TOTP ikinci adımı (US-002)
      security: []
      parameters: [ { $ref: '#/components/parameters/XClient' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pendingToken, code]
              properties:
                pendingToken: { type: string, description: otp/verify yanıtındaki ön oturum anahtarı (nextStep = totp) }
                code:
                  type: string
                  description: >-
                    6 haneli TOTP kodu veya kurtarma kodu (XXXXX-XXXXX, bir kez kullanılır; F1.6).
                    Aynı TOTP kodu ikinci kez kabul edilmez.
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200':
          description: Doğrulandı, oturum açıldı (nextStep = none). Web'de `refreshToken` cookie'de.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /api/v1/auth/totp/setup:
    post:
      tags: [auth]
      summary: TOTP kurulumu başlat / tamamla (US-002)
      description: >-
        Yetki Authorization Bearer ile: ön oturum anahtarı (otp/verify yanıtındaki pendingToken,
        nextStep = totp_setup; F1.6). confirmCode boşsa yeni sır üretilir ve otpauthUri döner; doluysa
        kod doğrulanır, kurulum etkinleşir ve 10 kurtarma kodu yalnızca bu yanıtta bir kez döner.
        Kurulu kullanıcı için 409 INVALID_STATE_TRANSITION.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmCode: { type: string, description: Boşsa kurulum başlatılır }
      responses:
        '200':
          description: Kurulum bilgisi veya kurtarma kodları
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUri: { type: string }
                  recoveryCodes: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Erişim anahtarını yenile (yenileme anahtarı döndürülür)
      description: >-
        Gövdedeki `refreshToken` (mobil) önceliklidir. Gövdede yoksa `b2b_rt` cookie'si okunur (web);
        bu durumda `X-Requested-With` zorunludur, yoksa anahtar tüketilmeden `401 UNAUTHENTICATED`
        (TM-21). Cookie ile yenilemede yeni anahtar yine cookie'ye yazılır ve gövdede dönmez; yenileme
        başarısızsa cookie silinir (F1.13a).
      security: []
      parameters:
        - { $ref: '#/components/parameters/XClient' }
        - { $ref: '#/components/parameters/XRequestedWith' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Mobil. Web'de httpOnly cookie kullanılır. }
      responses:
        '200':
          description: Yeni anahtarlar
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Bu oturumdan çıkış
      description: Oturum ailesi kapatılır; web cookie'si (`b2b_rt`) her durumda silinir (F1.13a).
      responses:
        '204':
          description: Çıkış yapıldı
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      summary: Açık oturumlarım (US-004)
      responses:
        '200':
          description: Oturumlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Bir oturumu kapat (US-004)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Kapatıldı }

  # ---------------------------------------------------------------- me
  /api/v1/me:
    get:
      tags: [me]
      summary: Kullanıcı, üyelikler ve aktif işletmedeki izinler
      parameters: [ { $ref: '#/components/parameters/BusinessIdOptional' } ]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
    patch:
      tags: [me]
      summary: Ad, dil, saat dilimi güncelle
      description: >-
        Yalnızca verilen alanlar değişir. `preferredLanguage` etkin bir dil olmalıdır (US-058 AC1, AC4);
        pasif dil veya geçersiz saat dilimi `422 VALIDATION_FAILED` (F1.13a).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, maxLength: 120 }
                preferredLanguage: { $ref: '#/components/schemas/LanguageCode' }
                timezone: { type: string, examples: [Asia/Baku] }
      responses:
        '200': { description: Güncellendi }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- business
  /api/v1/buyers/register:
    post:
      tags: [business]
      summary: Perakendeci self-servis kaydı (US-005)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, legalName, activityTypeId, regionId, consentVersion]
              properties:
                fullName: { type: string, maxLength: 120 }
                legalName: { type: string, maxLength: 200 }
                activityTypeId: { type: string, format: uuid }
                regionId: { type: string, format: uuid }
                consentVersion: { type: string }
                preferredLanguage: { $ref: '#/components/schemas/LanguageCode' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  businessId: { type: string, format: uuid }
                  profileCompleteness: { type: integer }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/seller-applications:
    post:
      tags: [business]
      summary: Toptancı başvuru formu (US-008)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legalName, voen, contactName, phone, regionId]
              properties:
                legalName: { type: string }
                voen: { $ref: '#/components/schemas/Voen' }
                contactName: { type: string }
                phone: { $ref: '#/components/schemas/PhoneE164' }
                regionId: { type: string, format: uuid }
                categoryNote: { type: string, maxLength: 500 }
      responses:
        '201': { description: Başvuru alındı }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/business:
    get:
      tags: [business]
      summary: Aktif işletmenin profili
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: İşletme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
    patch:
      tags: [business]
      summary: İşletme profilini güncelle (VÖEN dahil, US-006)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessUpdate' }
      responses:
        '200': { description: Güncellendi }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/business/privacy:
    get:
      tags: [business]
      summary: Görünürlük ayarları (US-007)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Ayarlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Privacy' }
    put:
      tags: [business]
      summary: Görünürlük ayarlarını güncelle (US-007)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Privacy' }
      responses:
        '200': { description: Güncellendi }
  /api/v1/branches:
    get:
      tags: [business]
      summary: Şubeler
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Branch' } }
    post:
      tags: [business]
      summary: Şube oluştur (US-010)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201': { description: Oluşturuldu }
  /api/v1/branches/{id}:
    patch:
      tags: [business]
      summary: Şube güncelle / pasifleştir
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '200': { description: Güncellendi }
  /api/v1/warehouses:
    get:
      tags: [business]
      summary: Depolar
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200': { description: Liste }
    post:
      tags: [business]
      summary: Depo oluştur (US-011)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                addressLine: { type: string }
      responses:
        '201': { description: Oluşturuldu }
        '403': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- team
  /api/v1/team/members:
    get:
      tags: [team]
      summary: Üyeler
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200': { description: Liste }
  /api/v1/team/members/{id}:
    patch:
      tags: [team]
      summary: Üyenin rolünü / kapsamını değiştir veya çıkar (US-013)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId: { type: string, format: uuid }
                branchId: { type: [string, 'null'], format: uuid }
                warehouseId: { type: [string, 'null'], format: uuid }
                regionIds: { type: array, items: { type: string, format: uuid } }
                status: { type: string, enum: [active, removed] }
      responses:
        '200': { description: Güncellendi }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/team/invitations:
    post:
      tags: [team]
      summary: Kullanıcı davet et (US-013)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [phone, jobTitleId, roleId]
              properties:
                phone: { $ref: '#/components/schemas/PhoneE164' }
                jobTitleId: { type: string, format: uuid }
                roleId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
                warehouseId: { type: string, format: uuid }
      responses:
        '201': { description: Davet gönderildi }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/team/invitations/accept:
    post:
      tags: [team]
      summary: Daveti kabul et (OTP ile giriş yapmış kullanıcı)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Üyelik aktif }
  /api/v1/team/roles:
    get:
      tags: [team]
      summary: İşletme rolleri ve kullanılabilir şablonlar
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200': { description: Liste }
    post:
      tags: [team]
      summary: Şablondan özel rol oluştur (US-014)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [templateId, name, permissions]
              properties:
                templateId: { type: string, format: uuid }
                name: { $ref: '#/components/schemas/LocalizedText' }
                permissions:
                  type: array
                  items: { $ref: '#/components/schemas/RolePermission' }
      responses:
        '201': { description: Oluşturuldu }

  # ---------------------------------------------------------------- directory
  /api/v1/directory/buyers:
    get:
      tags: [directory]
      summary: Perakendeci dizini (US-019, US-020) — yalnızca seller
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { name: q, in: query, schema: { type: string } }
        - { name: phone, in: query, description: Tam E.164 eşleşme, schema: { $ref: '#/components/schemas/PhoneE164' } }
        - { name: voen, in: query, description: Tam eşleşme, schema: { $ref: '#/components/schemas/Voen' } }
        - { name: regionId, in: query, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: activityTypeId, in: query, schema: { type: string, format: uuid } }
        - { name: verified, in: query, schema: { type: boolean } }
        - { name: history, in: query, schema: { type: string, enum: [never, rejected, cancelled, cooldown_over, pending, active] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: limit, in: query, schema: { type: integer, maximum: 20, default: 20 } }
      responses:
        '200':
          description: Sonuçlar (yalnızca görünür alanlar)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DirectoryBuyer' } }
                  nextCursor: { type: [string, 'null'] }
        '429': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- connections
  /api/v1/connection-requests:
    post:
      tags: [connections]
      summary: Bağlantı isteği gönder (US-021)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [buyerId]
              properties:
                buyerId: { type: string, format: uuid }
                message: { type: string, maxLength: 500 }
                proposedPaymentTermDays: { type: integer, minimum: 0, maximum: 180 }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionRequest' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/connection-requests/outgoing:
    get:
      tags: [connections]
      summary: Gönderilen istekler (seller)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }, { name: status, in: query, schema: { type: string } } ]
      responses:
        '200': { description: Liste }
  /api/v1/connection-requests/incoming:
    get:
      tags: [connections]
      summary: Gelen istekler (buyer) — satıcı profil özetiyle (US-023)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: Liste }
  /api/v1/connection-requests/{id}/accept:
    post:
      tags: [connections]
      summary: İsteği kabul et (US-023)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Bağlantı oluştu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/connection-requests/{id}/reject:
    post:
      tags: [connections]
      summary: İsteği reddet (US-023)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Reddedildi }
  /api/v1/connection-requests/{id}/withdraw:
    post:
      tags: [connections]
      summary: İsteği geri çek (US-022)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Geri çekildi }
  /api/v1/connections:
    get:
      tags: [connections]
      summary: Bağlantılarım (seller veya buyer bakışı)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: status, in: query, schema: { type: string, enum: [active, cancelled] } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: Liste }
  /api/v1/connections/{id}/terms:
    patch:
      tags: [connections]
      summary: Bağlantı koşulları (US-024) — yalnızca seller
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionTerms' }
      responses:
        '200': { description: Güncellendi }
  /api/v1/connections/{id}/cancel:
    post:
      tags: [connections]
      summary: Bağlantıyı iptal et (US-025)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirm]
              properties:
                reason: { type: string, enum: [no_longer_working, payment_issue, quality_issue, other] }
                note: { type: string, maxLength: 500 }
                confirm: { type: boolean, const: true }
      responses:
        '200':
          description: İptal edildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelledOrders: { type: integer }
  /api/v1/blocks:
    get:
      tags: [connections]
      summary: Engellenen toptancılar (buyer)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200': { description: Liste }
    post:
      tags: [connections]
      summary: Toptancıyı engelle (US-023)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sellerId]
              properties:
                sellerId: { type: string, format: uuid }
      responses:
        '201': { description: Engellendi }
  /api/v1/blocks/{sellerId}:
    delete:
      tags: [connections]
      summary: Engeli kaldır
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: sellerId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Kaldırıldı }

  # ---------------------------------------------------------------- catalog
  /api/v1/catalog/units:
    get:
      tags: [catalog]
      summary: Birim kataloğu
      responses:
        '200': { description: Liste }
  /api/v1/catalog/categories:
    get:
      tags: [catalog]
      summary: Kategori ağacı
      responses:
        '200': { description: Liste }
  /api/v1/catalog/brands:
    get:
      tags: [catalog]
      summary: Markalar
      parameters: [ { name: q, in: query, schema: { type: string } } ]
      responses:
        '200': { description: Liste }
    post:
      tags: [catalog]
      summary: Marka talebi (US-029 AC2)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201': { description: Talep oluştu }
  /api/v1/catalog/activity-types:
    get:
      tags: [catalog]
      summary: Faaliyet alanları
      security: []
      responses:
        '200': { description: Liste }
  /api/v1/catalog/regions:
    get:
      tags: [catalog]
      summary: Şehir / rayon listesi (F1.3)
      security: []
      parameters:
        - name: country
          in: query
          description: ISO 3166-1 alfa-2 ülke kodu. Bilinmeyen ülke boş liste döner.
          schema: { type: string, pattern: '^[A-Z]{2}$', default: AZ }
      responses:
        '200':
          description: Liste (önce şehirler, sonra rayonlar; az adına göre)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Region' } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/products:
    get:
      tags: [catalog]
      summary: Kendi ürünlerim (seller)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: q, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: Liste }
    post:
      tags: [catalog]
      summary: Ürün oluştur (US-030)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/products/{id}:
    get:
      tags: [catalog]
      summary: Ürün detayı (seller)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Ürün
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
    patch:
      tags: [catalog]
      summary: Ürün güncelle / yayınla / arşivle
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Güncellendi }
  /api/v1/browse/products:
    get:
      tags: [catalog]
      summary: Perakendecinin ürün listesi — yalnızca aktif bağlantılar (US-032, US-033)
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { name: branchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - { name: gtin, in: query, schema: { type: string } }
        - { name: sellerId, in: query, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: brandId, in: query, schema: { type: string, format: uuid } }
        - { name: priceMin, in: query, schema: { type: string } }
        - { name: priceMax, in: query, schema: { type: string } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: isNew, in: query, schema: { type: boolean } }
        - { name: purchasedBefore, in: query, schema: { type: boolean } }
        - { name: favorites, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Ürünler, alıcıya uygulanacak fiyatla
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BrowseProduct' } }
                  nextCursor: { type: [string, 'null'] }
  /api/v1/favorites/{productId}:
    put:
      tags: [catalog]
      summary: Favorilere ekle (US-045)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: productId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Eklendi }
    delete:
      tags: [catalog]
      summary: Favorilerden çıkar
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: productId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Çıkarıldı }

  # ---------------------------------------------------------------- pricing
  /api/v1/price-lists:
    get:
      tags: [pricing]
      summary: Fiyat listeleri
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200': { description: Liste }
    post:
      tags: [pricing]
      summary: Fiyat listesi oluştur (US-034)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceListInput' }
      responses:
        '201': { description: Oluşturuldu }
  /api/v1/price-lists/{id}/items:
    put:
      tags: [pricing]
      summary: Liste fiyatlarını toplu ayarla (geçerlilik tarihiyle)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                validFrom: { type: string, format: date-time }
                items:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [packagingId, unitPrice]
                    properties:
                      packagingId: { type: string, format: uuid }
                      unitPrice: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200': { description: Kaydedildi }
  /api/v1/customer-prices:
    get:
      tags: [pricing]
      summary: Müşteri / şube fiyatları
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: buyerId, in: query, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Liste }
    put:
      tags: [pricing]
      summary: Müşteri / şube fiyatı ayarla (US-035, US-036)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [buyerId, items]
              properties:
                buyerId: { type: string, format: uuid }
                branchId: { type: [string, 'null'], format: uuid }
                validFrom: { type: string, format: date-time }
                items:
                  type: array
                  items:
                    type: object
                    required: [packagingId, unitPrice]
                    properties:
                      packagingId: { type: string, format: uuid }
                      unitPrice: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200': { description: Kaydedildi }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/branch-discounts:
    get:
      tags: [pricing]
      summary: Şube indirimleri
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: buyerId, in: query, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Liste }
    post:
      tags: [pricing]
      summary: Şube indirimi oluştur (US-036)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchDiscountInput' }
      responses:
        '201': { description: Oluşturuldu }
  /api/v1/tier-prices:
    put:
      tags: [pricing]
      summary: Kademeli fiyat ayarla (US-037)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [packagingId, tiers]
              properties:
                packagingId: { type: string, format: uuid }
                tiers:
                  type: array
                  items:
                    type: object
                    required: [minQty, discountPercent]
                    properties:
                      minQty: { $ref: '#/components/schemas/Decimal' }
                      discountPercent: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200': { description: Kaydedildi }
  /api/v1/prices/explain:
    get:
      tags: [pricing]
      summary: Bir alıcı için fiyatın kaynağını göster (US-034 AC5)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: buyerId, in: query, required: true, schema: { type: string, format: uuid } }, { name: branchId, in: query, schema: { type: string, format: uuid } }, { name: packagingId, in: query, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: Çözümleme adımları
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedPrice' }

  # ---------------------------------------------------------------- inventory
  /api/v1/stock:
    get:
      tags: [inventory]
      summary: Stok (seller)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: warehouseId, in: query, schema: { type: string, format: uuid } }, { name: low, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: Liste }
  /api/v1/stock/movements:
    post:
      tags: [inventory]
      summary: Mal girişi veya sayım düzeltmesi (US-039)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, variantId, type, qty]
              properties:
                warehouseId: { type: string, format: uuid }
                variantId: { type: string, format: uuid }
                type: { type: string, enum: [receipt, adjustment] }
                qty: { $ref: '#/components/schemas/Decimal' }
                lotNo: { type: string }
                expiryDate: { type: string, format: date }
                note: { type: string }
      responses:
        '201': { description: Kaydedildi }
  /api/v1/variants/{id}/availability:
    put:
      tags: [inventory]
      summary: Var / yok işaretle (US-038)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [isAvailable]
              properties:
                isAvailable: { type: boolean }
      responses:
        '200': { description: Güncellendi }

  # ---------------------------------------------------------------- cart
  /api/v1/cart:
    get:
      tags: [cart]
      summary: Şube sepeti (US-040)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: branchId, in: query, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: Satıcıya göre gruplu sepet, güncel fiyatlarla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /api/v1/cart/items:
    put:
      tags: [cart]
      summary: Kalem ekle / miktar güncelle (0 = sil)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [branchId, packagingId, qty]
              properties:
                branchId: { type: string, format: uuid }
                packagingId: { type: string, format: uuid }
                qty: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200':
          description: Güncel sepet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/cart/submit:
    post:
      tags: [cart]
      summary: Sepeti gönder veya onaya gönder (US-041, US-042)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [branchId]
              properties:
                branchId: { type: string, format: uuid }
      responses:
        '200':
          description: Onay gerekmedi; siparişler oluştu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResult' }
        '202':
          description: Şube onayı bekleniyor
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/cart/approve:
    post:
      tags: [cart]
      summary: Şube admini onaylar ve gönderir (US-041)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [branchId]
              properties:
                branchId: { type: string, format: uuid }
      responses:
        '200':
          description: Siparişler oluştu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResult' }
  /api/v1/cart/return:
    post:
      tags: [cart]
      summary: Şube admini sepeti geri gönderir (US-041 AC3)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [branchId, note]
              properties:
                branchId: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: Geri gönderildi }

  # ---------------------------------------------------------------- orders
  /api/v1/orders:
    get:
      tags: [orders]
      summary: Siparişler (seller veya buyer bakışı)
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/OrderStatus' } } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: counterpartyId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Liste }
  /api/v1/orders/{id}:
    get:
      tags: [orders]
      summary: Sipariş detayı
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Sipariş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/approve:
    post:
      tags: [orders]
      summary: Tam veya kısmi onay (US-043)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lines:
                  type: array
                  description: Boşsa tüm satırlar istenen miktarla onaylanır
                  items:
                    type: object
                    required: [itemId, qtyApproved]
                    properties:
                      itemId: { type: string, format: uuid }
                      qtyApproved: { $ref: '#/components/schemas/Decimal' }
                      reason: { type: string }
                      lotNo: { type: string }
                      expiryDate: { type: string, format: date }
      responses:
        '200': { description: Onaylandı }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/reject:
    post:
      tags: [orders]
      summary: Reddet (US-043)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Reddedildi }
  /api/v1/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: İptal (buyer yalnızca submitted; seller approved/preparing)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: İptal edildi }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/prepare:
    post:
      tags: [orders]
      summary: Hazırlanıyor (US-043 AC5)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Güncellendi }
  /api/v1/orders/{id}/confirm-delivery:
    post:
      tags: [orders]
      summary: Perakendeci teslimi onaylar (US-048)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: Teslim kesinleşti }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/dispute:
    post:
      tags: [orders]
      summary: Perakendeci itiraz eder (US-048)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, description]
              properties:
                type: { type: string, enum: [missing, damaged, not_received] }
                description: { type: string, maxLength: 1000 }
                fileId: { type: string, format: uuid }
      responses:
        '201': { description: İtiraz açıldı }
  /api/v1/orders/{id}/resolve-dispute:
    post:
      tags: [orders]
      summary: Toptancı itirazı çözer (US-048 AC4)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [accept, reject] }
                note: { type: string, maxLength: 1000 }
                lines:
                  type: array
                  items:
                    type: object
                    required: [itemId, qtyDelivered]
                    properties:
                      itemId: { type: string, format: uuid }
                      qtyDelivered: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200': { description: Çözüldü }
  /api/v1/orders/{id}/document:
    post:
      tags: [documents]
      summary: Sipariş belgesi PDF üret / getir (US-044)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Hazır; süreli indirme bağlantısı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRef' }
        '202': { description: Üretiliyor; tekrar sorgulayın }
  /api/v1/orders/{id}/einvoice-number:
    put:
      tags: [orders]
      summary: e-qaimə numarasını elle gir (US-053 AC2)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [einvoiceNumber]
              properties:
                einvoiceNumber: { type: string, maxLength: 50 }
      responses:
        '200': { description: Kaydedildi }
  /api/v1/orders/{id}/reorder:
    post:
      tags: [orders]
      summary: Tekrar sipariş — kalemleri sepete ekler (US-045)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Eklenen ve eklenemeyen kalemler }

  # ---------------------------------------------------------------- delivery
  /api/v1/orders/{id}/delivery:
    post:
      tags: [delivery]
      summary: Kargocu ata veya dış kargoya ver (US-046, US-049)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [provider, courierMembershipId]
                  properties:
                    provider: { const: own_courier }
                    courierMembershipId: { type: string, format: uuid }
                - type: object
                  required: [provider, carrierName, trackingNo]
                  properties:
                    provider: { const: manual_carrier }
                    carrierName: { type: string }
                    trackingNo: { type: string }
      responses:
        '201': { description: Teslimat oluştu }
  /api/v1/deliveries/mine:
    get:
      tags: [delivery]
      summary: Kargocunun teslimatları (US-046 AC3)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: status, in: query, schema: { type: string } } ]
      responses:
        '200': { description: Liste }
  /api/v1/deliveries/{id}/depart:
    post:
      tags: [delivery]
      summary: Yola çıktım
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Güncellendi }
  /api/v1/deliveries/{id}/delivered:
    post:
      tags: [delivery]
      summary: Teslim ettim (US-047)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                photoFileId: { type: string, format: uuid }
                lat: { type: number }
                lng: { type: number }
                deliveredAt: { type: string, format: date-time, description: Çevrimdışı gönderimde istemci zamanı }
                cashCollected:
                  type: object
                  properties:
                    amount: { $ref: '#/components/schemas/Decimal' }
                    currency: { $ref: '#/components/schemas/CurrencyCode' }
