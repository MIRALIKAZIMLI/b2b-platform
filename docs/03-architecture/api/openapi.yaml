openapi: 3.1.0
info:
  title: B2B Toptan–Perakende Platformu API
  version: 1.0.0
  description: |
    MVP API sözleşmesi. Bu dosya tek doğru kaynaktır; web ve mobil istemci tipleri
    bu dosyadan üretilir (packages/api-client).

    Genel kurallar:
    - Tüm uç noktalar /api/v1 altındadır. Kırıcı değişiklik yalnızca /api/v2 ile (NFR-85).
    - Kiracıya bağlı uç noktalar `X-Business-Id` başlığı ister; değer, kullanıcının aktif
      üyeliği olan bir işletme olmalıdır.
    - Para tutarları string ondalık olarak döner ("1234.50") ve her zaman para birimiyle birlikte.
    - Zamanlar ISO 8601, UTC ("2026-10-24T08:00:00Z"). Gösterim istemcinin işidir.
    - Liste uç noktaları imleç (cursor) sayfalaması kullanır: `?cursor=&limit=` (limit en fazla 100,
      varsayılan 20).
    - "Oluştur" ve durum değiştiren POST uç noktaları `Idempotency-Key` başlığını kabul eder
      (24 saat geçerli).
    - Hata yanıtı her zaman `Error` şemasıdır.
    - `Accept-Language` (az, ru, tr, en) hata mesajı ve içerik dilini belirler; yoksa kullanıcının
      tercih ettiği dil kullanılır.
servers:
  - url: https://api.example.az
    description: Production (alan adı F0.4'te belirlenecek)
  - url: https://api.staging.example.az
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: me
  - name: business
  - name: team
  - name: directory
  - name: connections
  - name: catalog
  - name: pricing
  - name: inventory
  - name: cart
  - name: orders
  - name: delivery
  - name: ledger
  - name: documents
  - name: imports
  - name: files
  - name: notifications
  - name: dashboard
  - name: system
  - name: admin
  - name: dev

paths:
  # ---------------------------------------------------------------- auth
  /api/v1/auth/otp/request:
    post:
      tags: [auth]
      summary: OTP kodu iste (US-001)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { $ref: '#/components/schemas/PhoneE164' }
                purpose: { type: string, enum: [login, register, invitation] }
      responses:
        '202':
          description: Kod gönderildi
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, expiresAt]
                properties:
                  challengeId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      summary: OTP kodunu doğrula ve oturum aç (US-001)
      security: []
      parameters: [ { $ref: '#/components/parameters/XClient' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200':
          description: Doğrulandı. Web'de `refreshToken` gövdede yok, cookie'de.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /api/v1/auth/totp/verify:
    post:
      tags: [auth]
      summary: TOTP ikinci adımı (US-002)
      security: []
      parameters: [ { $ref: '#/components/parameters/XClient' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pendingToken, code]
              properties:
                pendingToken: { type: string, description: otp/verify yanıtındaki ön oturum anahtarı (nextStep = totp) }
                code:
                  type: string
                  description: >-
                    6 haneli TOTP kodu veya kurtarma kodu (XXXXX-XXXXX, bir kez kullanılır; F1.6).
                    Aynı TOTP kodu ikinci kez kabul edilmez.
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200':
          description: Doğrulandı, oturum açıldı (nextStep = none). Web'de `refreshToken` cookie'de.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /api/v1/auth/totp/setup:
    post:
      tags: [auth]
      summary: TOTP kurulumu başlat / tamamla (US-002)
      description: >-
        Yetki Authorization Bearer ile: ön oturum anahtarı (otp/verify yanıtındaki pendingToken,
        nextStep = totp_setup; F1.6). confirmCode boşsa yeni sır üretilir ve otpauthUri döner; doluysa
        kod doğrulanır, kurulum etkinleşir ve 10 kurtarma kodu yalnızca bu yanıtta bir kez döner.
        Kurulu kullanıcı için 409 INVALID_STATE_TRANSITION.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmCode: { type: string, description: Boşsa kurulum başlatılır }
      responses:
        '200':
          description: Kurulum bilgisi veya kurtarma kodları
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUri: { type: string }
                  recoveryCodes: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Erişim anahtarını yenile (yenileme anahtarı döndürülür)
      description: >-
        Gövdedeki `refreshToken` (mobil) önceliklidir. Gövdede yoksa `b2b_rt` cookie'si okunur (web);
        bu durumda `X-Requested-With` zorunludur, yoksa anahtar tüketilmeden `401 UNAUTHENTICATED`
        (TM-21). Cookie ile yenilemede yeni anahtar yine cookie'ye yazılır ve gövdede dönmez; yenileme
        başarısızsa cookie silinir (F1.13a).
      security: []
      parameters:
        - { $ref: '#/components/parameters/XClient' }
        - { $ref: '#/components/parameters/XRequestedWith' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: Mobil. Web'de httpOnly cookie kullanılır. }
      responses:
        '200':
          description: Yeni anahtarlar
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Bu oturumdan çıkış
      description: Oturum ailesi kapatılır; web cookie'si (`b2b_rt`) her durumda silinir (F1.13a).
      responses:
        '204':
          description: Çıkış yapıldı
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      summary: Açık oturumlarım (US-004)
      responses:
        '200':
          description: Oturumlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Bir oturumu kapat (US-004)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Kapatıldı }

  # ---------------------------------------------------------------- me
  /api/v1/me:
    get:
      tags: [me]
      summary: Kullanıcı, üyelikler ve aktif işletmedeki izinler
      parameters: [ { $ref: '#/components/parameters/BusinessIdOptional' } ]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
    patch:
      tags: [me]
      summary: Ad, dil, saat dilimi güncelle
      description: >-
        Yalnızca verilen alanlar değişir. `preferredLanguage` etkin bir dil olmalıdır (US-058 AC1, AC4);
        pasif dil veya geçersiz saat dilimi `422 VALIDATION_FAILED` (F1.13a).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, maxLength: 120 }
                preferredLanguage: { $ref: '#/components/schemas/LanguageCode' }
                timezone: { type: string, examples: [Asia/Baku] }
                lastBusinessId:
                  type: string
                  format: uuid
                  description: >-
                    Son kullanılan işletme (US-003 AC1, F2.7). Kullanıcının aktif üyeliği
                    olmayan işletme `422 VALIDATION_FAILED`.
      responses:
        '200': { description: Güncellendi }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- business
  /api/v1/buyers/register:
    post:
      tags: [business]
      summary: Perakendeci self-servis kaydı (US-005)
      description: >-
        Kimliksiz uç; yetki `Authorization: Bearer <pendingToken>` ile (otp/verify yanıtında
        `nextStep = register`; F2.3a K5). Erişim anahtarı veya TOTP ön oturumu kabul edilmez → `401`.
        Tek işlemde kullanıcı, işletme (`created_via = self_signup`), `buyer` yeteneği (`approved`),
        perakendeci profili, gizlilik (hepsi kapalı), varsayılan şube (`approval_rule = every_order`,
        adres boş), işletme admini rolü ve üyeliği, `onboarding.buyer_plan_code` planıyla abonelik ve
        `buyer.registered` olayı yazılır (R15). Para birimi ve saat dilimi bölgenin ülkesinden; dil
        `preferredLanguage` veya platform varsayılanı. `consentVersion` güncel veri paylaşım metni
        sürümü (`legal.data_sharing_version`) olmalı, aksi `422` (`consentVersion: outdated`); onay
        sürümü ve zamanı işletmeye yazılır (NFR-63). Bilinmeyen bölge, pasif faaliyet türü veya pasif
        dil `422` (`<alan>: not_found`).
        Telefon zaten kayıtlıysa `409 PHONE_ALREADY_REGISTERED` (US-005 AC4; istemci girişe yönlendirir).
        İdempotens kapsamı kayıt anahtarındaki telefondur (R13): aynı `Idempotency-Key` ve aynı gövde
        saklanan 201 gövdesini döner (oturum alanları olmadan); aynı anahtar farklı gövde
        `409 IDEMPOTENCY_CONFLICT`. Eşzamanlı ikinci istek ilkinin bitmesini bekler ve aynı yanıtı
        alır. Yanıt kayıtla aynı işlemde saklanır (R12). Kayıt anahtarı fiilen tek kullanımlıktır.
        İlk başarılı yanıtta oturum açılır (K6): `accessToken`, `expiresIn` ve mobilde `refreshToken`;
        `X-Client: web` ise yenileme anahtarı httpOnly cookie'de. IP başına saatte
        `buyer_registration.ip_max_per_hour` istek; aşılırsa `429 RATE_LIMITED` (`Retry-After`).
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: X-Client
          in: header
          required: false
          schema: { type: string, enum: [web] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fullName, legalName, activityTypeId, regionId, consentVersion]
              properties:
                fullName: { type: string, minLength: 1, maxLength: 120 }
                legalName: { type: string, minLength: 1, maxLength: 200 }
                activityTypeId: { type: string, format: uuid }
                regionId: { type: string, format: uuid }
                consentVersion: { type: string, minLength: 1, maxLength: 20, examples: [v1] }
                preferredLanguage: { $ref: '#/components/schemas/LanguageCode' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                type: object
                required: [businessId, profileCompleteness]
                properties:
                  businessId: { type: string, format: uuid }
                  profileCompleteness: { type: integer, minimum: 0, maximum: 100 }
                  accessToken: { type: string, description: Yalnızca ilk başarılı yanıtta }
                  expiresIn: { type: integer, description: saniye }
                  refreshToken: { type: string, description: Yalnızca mobil, ilk başarılı yanıtta }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/seller-applications:
    post:
      tags: [business]
      summary: Toptancı başvuru formu (US-008)
      description: >
        Kimliksiz. Başvuru `pending` durumunda kaydedilir ve admin başvuru listesine düşer (US-008 AC1).
        IP başına saatte `seller_application.ip_max_per_hour` başvuru; aşılırsa `429 RATE_LIMITED`
        (`details.retryAfter`, `Retry-After`). Aynı VÖEN ile `pending` başvuru varsa
        `409 SELLER_APPLICATION_ALREADY_PENDING` (AC3). Bilinmeyen bölge `422` (`regionId: not_found`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalName, voen, contactName, phone, regionId]
              properties:
                legalName: { type: string, minLength: 1, maxLength: 200 }
                voen: { $ref: '#/components/schemas/Voen' }
                contactName: { type: string, minLength: 1, maxLength: 120 }
                phone: { $ref: '#/components/schemas/PhoneE164' }
                regionId: { type: string, format: uuid }
                categoryNote: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Başvuru alındı
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pending] }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/business:
    get:
      tags: [business]
      summary: Aktif işletmenin profili
      description: >-
        İzin `business.manage` (F2.3b, Mimar onayı). Perakendeci ana sayfasındaki "Profilinizi
        tamamlayın" kartı `profileCompleteness`'i buradan okur (US-005 AC2). Logo adresi profil
        düzenlemesine kadar `null`.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: İşletme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
    patch:
      tags: [business]
      summary: İşletme profilini güncelle (VÖEN dahil, US-006)
      description: >-
        İzin `business.manage` (F2.4). Yalnız gönderilen alanlar değişir; boş gövde `422`.
        F2.4'te desteklenen alanlar `voen`, `legalName`, `regionId`, `addressLine`,
        `businessPhone`; F2.10b ile 🔒 `contactName`, `personalPhone`, `email` (`person_data`;
        telefon ve e-posta `null` ile silinir, yetkili adı silinemez) ve `logoFileId` (bu işletmenin
        hazır `logo` dosyası, aksi `422 details.logoFileId = [invalid_logo]`; `null` kaldırır,
        ADR-0024). Biçimi hatalı VÖEN `422 VALIDATION_FAILED`,
        `details.voen = [VOEN_INVALID]` (US-006 AC1). Başka işletmede kayıtlı VÖEN
        `409 VOEN_ALREADY_REGISTERED` (AC3). `legalType` VÖEN'in son hanesinden türetilir; VÖEN
        değişince `verified` false olur (AC2, R20). VARSAYIM (F2.4 K2): VÖEN yalnız `buyer`
        yeteneği olan işletmede değişir, aksi `403 CAPABILITY_REQUIRED`. VARSAYIM (K3): VÖEN
        silinemez; aynı değer değişiklik sayılmaz.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessUpdate' }
      responses:
        '200':
          description: Güncellendi; güncel işletme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/business/privacy:
    get:
      tags: [business]
      summary: Görünürlük ayarları (US-007)
      description: >-
        İzin `business.manage`, yetenek `buyer` (F2.10; VARSAYIM V1: yeteneği olmayan işletme
        `403 CAPABILITY_REQUIRED`). Yeni kayıtta `listedInDirectory` true, diğerleri false (AC1).
        Ünvan, faaliyet alanı ve şehir/rayon her zaman açıktır; anahtarları yoktur (AC3).
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Ayarlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Privacy' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [business]
      summary: Görünürlük ayarlarını güncelle (US-007)
      description: >-
        İzin `business.manage`, yetenek `buyer` (F2.10). Tam gövde: yedi anahtarın hepsi
        zorunlu, başka anahtar `422 VALIDATION_FAILED` (VARSAYIM V2; AC3 `showLegalName` gibi
        alan yok). Değişiklik varsa audit `business.privacy_updated` ve outbox
        `buyer.privacy_changed` (dizin indeksi, F2.11a). Yanıt güncel ayarlar.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Privacy' }
      responses:
        '200':
          description: Güncellendi; güncel ayarlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Privacy' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/branches:
    get:
      tags: [business]
      summary: Şubeler (F2.5; yalnız `buyer` yeteneği)
      description: >
        İzin `business.manage` (T8; ekip ekranı şube listesini depolardaki gibi bu izinle doldurur).
        İşletmenin `buyer` yeteneği yoksa `403 CAPABILITY_REQUIRED`. Aktifler önce, sonra ada göre.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Branch' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [business]
      summary: Şube oluştur (US-010 AC1, AC3)
      description: >
        `approvalRule` verilmezse `every_order` (AC3). `approvalThreshold` yalnız `above_amount`'ta ve
        orada zorunlu; > 0, en çok 2 ondalık. `lat` ve `lng` birlikte verilir. Bilinmeyen bölge 422.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/branches/{id}:
    get:
      tags: [business]
      summary: Şube
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Şube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [business]
      summary: Şube güncelle / pasifleştir (US-010 AC4)
      description: >
        Kısmi. Silme ucu yoktur; şube `status: inactive` ile pasifleşir. Kural `above_amount` dışına
        geçince eşik silinir; `above_amount`'ta eşik (gelen ya da mevcut) yoksa 422. `lat`/`lng`
        birlikte; ikisi `null` konumu siler. Son aktif şube pasifleşemez:
        `409 INVALID_STATE_TRANSITION` (`reason: last_active_branch`). Aktif üyesi veya açık daveti olan
        şube pasifleşemez: `409 INVALID_STATE_TRANSITION` (`reason: branch_in_use`, `members`, `invitations`).
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchPatch' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/business/seller-profile:
    get:
      tags: [business]
      summary: Satıcı profili (F2.6; yalnız `seller` yeteneği)
      description: >
        İzin `business.manage`; işletmenin `seller` yeteneği yoksa `403 CAPABILITY_REQUIRED`.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProfile' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [business]
      summary: Satıcı profilini güncelle (F2.6)
      description: >
        Yalnız gönderilen alanlar yazılır. `minOrderAmount: null` alt sınırı kaldırır. Stok modu ve
        düşük stok eşiği stok adımında (F3), varsayılan fiyat listesi F3.6'da; varsayılan depo
        `PATCH /api/v1/warehouses/{id}` (`isDefault: true`) ile değişir.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SellerProfileUpdate' }
      responses:
        '200':
          description: Güncellendi; güncel profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProfile' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/business/service-areas:
    get:
      tags: [business]
      summary: Hizmet bölgeleri (F2.6; yalnız `seller` yeteneği)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Bölgeler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAreas' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [business]
      summary: Hizmet bölgelerini değiştir (F2.6)
      description: >
        Listenin tamamı gönderilir; eski liste bununla değişir (boş liste = hizmet bölgesi yok).
        Bilinmeyen bölge `422` (`details.regionIds = ['not_found']`).
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAreas' }
      responses:
        '200':
          description: Güncellendi; güncel liste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAreas' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/warehouses:
    get:
      tags: [business]
      summary: Depolar (US-011; yalnız `seller` yeteneği)
      description: Varsayılan depo önce, sonra ada göre; pasif depolar da döner.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Warehouse' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [business]
      summary: Depo oluştur (US-011)
      description: >
        İlk depo varsayılan depo olur (AC1). Aktif depo sayısı `warehouses.max` hakkını aşacaksa
        `403 ENTITLEMENT_LIMIT_REACHED` (AC2; `details.key`, `details.limit`).
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                addressLine: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/warehouses/{id}:
    patch:
      tags: [business]
      summary: Depo güncelle, varsayılan yap, pasifleştir / etkinleştir (US-011)
      description: >
        Depo silinmez, yalnızca pasifleştirilir (AC3). Varsayılan depo pasifleştirilemez ve pasif
        depo varsayılan yapılamaz (`409 INVALID_STATE_TRANSITION`); önce başka depo varsayılan
        yapılır. `isDefault` yalnız `true` alır. Pasif depoyu etkinleştirmek `warehouses.max`
        hakkına tabidir (`403 ENTITLEMENT_LIMIT_REACHED`). Başka işletmenin deposu `404`.
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                addressLine: { type: [string, 'null'], maxLength: 300 }
                isDefault: { type: boolean, enum: [true] }
                status: { type: string, enum: [active, inactive] }
      responses:
        '200':
          description: Güncellendi; güncel depo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- team
  /api/v1/team/members:
    get:
      tags: [team]
      summary: Ekibin aktif üyeleri (US-013)
      description: >-
        İzin `team.manage`. Yalnız bağlamdaki işletmenin `active` üyelikleri (F2.7a).
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamMember' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/team/members/{id}:
    patch:
      tags: [team]
      summary: Üyenin rolünü / kapsamını değiştir veya çıkar (US-013)
      description: >-
        İzin `team.manage`. Yalnız verilen alanlar değişir; boş gövde `422`. Rol işletmenin rolü ve
        işletmenin yeteneğinde olmalı. Kapsam rolden türetilir (F2.7 K9): rolde `branch` kapsamlı
        izin varsa üyeliğin şubesi, `warehouse` kapsamlı izin varsa deposu olmalı; gerekmeyen kapsam
        alanı veya `assigned` kapsamı olmayan rolde `regionIds` `422 VALIDATION_FAILED`.
        Başka işletmenin şubesi/deposu veya olmayan bölge `404`. `status: removed` üyeliği çıkarır
        (bölgeleri silinir); tek admin kendi rolünü düşüremez / kendini çıkaramaz →
        `409 LAST_ADMIN_PROTECTED` (US-013 AC3). Çıkarılmış üye yalnızca yeniden davetle döner
        (`status: active` gönderilemez). Rol değişikliği audit'e kim, kime, eski ve yeni rol yazar;
        sonraki istekte geçerli olur (US-013 AC4). Aktif olmayan veya başka işletmenin üyeliği `404`.
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                roleId: { type: string, format: uuid }
                branchId: { type: [string, 'null'], format: uuid }
                warehouseId: { type: [string, 'null'], format: uuid }
                regionIds: { type: array, maxItems: 200, items: { type: string, format: uuid } }
                status: { type: string, enum: [removed] }
      responses:
        '200':
          description: Üyeliğin son hâli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/team/invitations:
    get:
      tags: [team]
      summary: Açık (kabul edilmemiş, süresi dolmamış) davetler
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamInvitation' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [team]
      summary: Kullanıcı davet et (US-013)
      description: >-
        İzin `team.manage`. Unvan aktif ve işletmenin yeteneğinde, rol işletmenin rolü olmalı;
        kapsam kuralı `PATCH /team/members/{id}` ile aynı (şube/depo). Telefon kayıtlı değilse
        kullanıcı satırı `fullName` ile oluşur, kayıtlıysa adı değişmez (F2.7 K1); yanıt iki durumda
        aynıdır. Telefon işletmede aktif üye → `409 MEMBER_ALREADY_EXISTS`. Aynı telefona açık davet
        varsa kapanır, yenisi gider (VARSAYIM K3). Planın `users.max` hakkı aktif üye + açık davet
        sayısıyla denetlenir; doluysa `403 ENTITLEMENT_LIMIT_REACHED` (US-013 AC2, VARSAYIM K2).
        Geçerlilik `invitation.team_days`. SMS (`WEB_BASE_URL/<dil>/activate?token=`) işlemden sonra
        gider; gönderilemezse davet kalır, `smsSent: false`. Kabul `POST /team/invitations/accept`.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, fullName, jobTitleId, roleId]
              properties:
                phone: { $ref: '#/components/schemas/PhoneE164' }
                fullName: { type: string, minLength: 1, maxLength: 120 }
                jobTitleId: { type: string, format: uuid }
                roleId: { type: string, format: uuid }
                branchId: { type: string, format: uuid }
                warehouseId: { type: string, format: uuid }
      responses:
        '201':
          description: Davet oluştu
          content:
            application/json:
              schema:
                type: object
                required: [invitationId, expiresAt, smsSent]
                properties:
                  invitationId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
                  smsSent: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/team/invitations/{id}/revoke:
    post:
      tags: [team]
      summary: Açık daveti geri çek (F2.7)
      description: >-
        İzin `team.manage`. Davetin süresi şimdiye çekilir (`expires_at = now`); bağlantı artık
        kabul edilmez ve `users.max` sayacından düşer. Kabul edilmiş, süresi dolmuş veya başka
        işletmenin daveti `404`.
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Geri çekildi }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/team/invitations/accept:
    post:
      tags: [team]
      summary: Daveti kabul et (OTP ile giriş yapmış kullanıcı)
      description: >
        Yalnızca giriş ister (işletme bağlamı yok). Oturumdaki kullanıcının telefonu davetteki
        telefonla aynı olmalıdır. Geçersiz, süresi dolmuş, kullanılmış, başka telefona ait davet
        veya kullanıcının zaten o işletmede aktif üyeliği varsa hepsi aynı `404 NOT_FOUND` döner (F2.1a).
        Kullanıcının o işletmede çıkarılmış (`removed`) üyeliği varsa aynı üyelik davetteki rol,
        unvan ve kapsamla yeniden aktif olur (F2.7a, VARSAYIM K5).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Üyelik aktif
          content:
            application/json:
              schema:
                type: object
                required: [businessId]
                properties:
                  businessId: { type: string, format: uuid }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/team/roles:
    get:
      tags: [team]
      summary: İşletme rolleri
      description: >-
        İzin `team.manage`. İşletmenin yeteneğindeki roller, izinleri ve kapsamlarıyla; istemci
        hangi kapsam alanının gerektiğini buradan bilir. `isCustom` rolleri F2.8 özel rolleridir.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamRole' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [team]
      summary: Şablondan özel rol oluştur (US-014)
      description: >-
        İzin `team.manage`. Şablon işletmenin yeteneğinde olmalı; izinler rolün yeteneğine ait
        olmalı ve kapsam iznin kapsam seçeneklerinden biri olmalı (aksi `422`, US-014 AC2). Özel rol
        işletme admini değildir. İşletme admini olmayan çağıran yalnızca kendisinde aynı kapsamda
        veya `all` kapsamda olan izinleri ekleyebilir (aksi `403 PERMISSION_DENIED`).
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [templateId, name, permissions]
              properties:
                templateId: { type: string, format: uuid }
                name: { $ref: '#/components/schemas/RoleName' }
                permissions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/RolePermission' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamRole' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/team/roles/{id}:
    patch:
      tags: [team]
      summary: Özel rolü düzenle (US-014)
      description: >-
        İzin `team.manage`. Yalnızca `isCustom` roller (şablon kopyası `422 roleId: not_editable`).
        `POST` ile aynı izin kuralları. Rol bir aktif üyeye veya açık davete bağlıyken gereken kapsam
        alanları (şube / depo / bölge) değişemez (`422 permissions: scope_change_in_use`). İzin
        değişince rolün üyelerinin izin önbelleği temizlenir; değişiklik sonraki istekte geçerlidir.
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/RoleName' }
                permissions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/RolePermission' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamRole' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/team/role-templates:
    get:
      tags: [team]
      summary: Özel rol için kopyalanabilir şablonlar (US-014)
      description: >-
        İzin `team.manage`. İşletmenin yeteneğindeki rol şablonları, varsayılan izin ve kapsamlarıyla.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleTemplate' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/team/job-titles:
    get:
      tags: [team]
      summary: Davet formu için unvanlar (F2.7)
      description: >-
        İzin `team.manage`. İşletmenin yeteneğindeki aktif unvanlar; `roleTemplateId` istemcinin
        önerilen rolü seçmesi içindir (işletme rolü `sourceTemplateId` ile eşleşir).
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobTitle' }
        '403': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- directory
  /api/v1/directory/buyers:
    get:
      tags: [directory]
      summary: Perakendeci dizini (US-019, US-020) — yalnızca seller
      description: |
        İzin `directory.search` (kapsam `all` / `assigned`). Filtre verilmezse yalnız toptancının
        hizmet bölgeleri (US-019 AC2); `assigned` kapsamlı üye yalnız atandığı bölgeleri görür,
        tam telefon / VÖEN araması dahil (US-019 AC3; F2.11b K3, kullanıcı değiştirebilir varsayım).
        `phone` veya `voen` tek başına verilir (diğer filtrelerle veya birlikte → 422); dizinde
        görünme kapalı perakendeciyi de bulur, kısmi değer eşleşmez (US-020). Kullanıcı başına
        dakikada `directory.search_max_per_minute` (60) arama; aşınca 429 + `Retry-After`
        (US-019 AC5). Dışa aktarma ucu yoktur (US-019 AC4). `history` (F2.12a): çağıran satıcının
        ilişki durumuna göre sayfa içinde süzülür (sayfa `limit`'ten kısa olabilir; `nextCursor` indeks sırasıdır).
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { name: q, in: query, description: Ünvanda arama, schema: { type: string, maxLength: 100 } }
        - { name: phone, in: query, description: 'Tam E.164 eşleşme: işletme, kişisel veya admin giriş telefonu', schema: { $ref: '#/components/schemas/PhoneE164' } }
        - { name: voen, in: query, description: Tam eşleşme, schema: { $ref: '#/components/schemas/Voen' } }
        - { name: regionId, in: query, description: Şehir verilirse ilçeleri de kapsar, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - { name: activityTypeId, in: query, schema: { type: string, format: uuid } }
        - { name: verified, in: query, schema: { type: boolean } }
        - { name: history, in: query, schema: { type: string, enum: [never, rejected, cancelled, cooldown_over, pending, active] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
      responses:
        '200':
          description: Sonuçlar (yalnızca görünür alanlar)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor, emptyReason]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DirectoryBuyer' } }
                  nextCursor: { type: [string, 'null'] }
                  emptyReason:
                    type: [string, 'null']
                    enum: [no_service_areas, no_assigned_regions, null]
                    description: Liste neden boş (istemci hizmet bölgesi / bölge atama ekranına yönlendirir)
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- connections
  /api/v1/connection-requests:
    post:
      tags: [connections]
      summary: Bağlantı isteği gönder (US-021)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [buyerId]
              additionalProperties: false
              properties:
                buyerId: { type: string, format: uuid }
                message: { type: string, maxLength: 500, description: Baştaki/sondaki boşluk atılır; boş mesaj gönderilmemiş sayılır }
                proposedPaymentTermDays: { type: integer, minimum: 0, maximum: 180 }
      description: |
        İzin `connections.request.send` (F2.12a). Kurallar sırasıyla (SF-03): aktif bağlantı (`409 CONNECTION_ALREADY_ACTIVE`),
        bekleyen istek (`409 CONNECTION_REQUEST_ALREADY_PENDING`), engel (`409 CONNECTION_BLOCKED`), bekleme süresi
        (`409 CONNECTION_COOLDOWN_ACTIVE`, `details.cooldownUntil`), günlük kota (`429 CONNECTION_DAILY_QUOTA_EXCEEDED`,
        `details.retryAfter` + `Retry-After` = satıcının saat diliminde gece yarısına kalan saniye). Etkin kota =
        `connection.daily_request_quota` ayarı ile plan hakkı `connection_requests.daily`'nin küçüğü (hak `null` = ayar).
        İstek alamayan perakendeci (yok, askıda/arşivde, `buyer` onaysız, çağıranın kendisi) veya temsilcinin
        (`assigned`) bölgesi dışındaki perakendeci `404 NOT_FOUND`. Salt-okunur abonelik `403 SUBSCRIPTION_READ_ONLY`.
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionRequest' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/connection-requests/outgoing:
    get:
      tags: [connections]
      summary: Gönderilen istekler (seller), yeniden eskiye
      description: İzin `connections.request.send`; temsilci (`assigned`) yalnız kendi gönderdiklerini görür (F2.12a). `limit` en fazla 50.
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }, { name: status, in: query, schema: { type: string, enum: [pending, accepted, rejected, expired, withdrawn] } } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/ConnectionRequest' }
                        - type: object
                          required: [buyerName]
                          properties:
                            buyerName: { type: [string, 'null'], description: Perakendecinin ünvanı; artık istek alamıyorsa null }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/connection-requests/incoming:
    get:
      tags: [connections]
      summary: Gelen bekleyen istekler (buyer) — satıcı profil özetiyle (US-023 AC1, AC6)
      description: |
        İzin `connections.view` (satın alma sorumlusu da görür, US-023 AC6). Yalnız `pending` ve süresi geçmemiş
        istekler (US-022 AC1, US-023 AC3), yeniden eskiye. Satıcı özeti yalnız ünvan, logo, tanıtım metni;
        ürün, fiyat, başka bağlantı bilgisi yok (F2.13a, R19). `limit` en fazla 50.
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/ConnectionRequest' }
                        - type: object
                          required: [seller]
                          properties:
                            seller: { $ref: '#/components/schemas/ConnectionSellerSummary' }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/connection-requests/{id}/accept:
    post:
      tags: [connections]
      summary: İsteği kabul et (US-023 AC2)
      description: |
        İzin `connections.request.respond` (yalnız `buyer`). Gövde veri paylaşım uyarısının onayıdır
        (`confirmDataSharing: true`, yoksa `422`); onay audit'e yazılır. İstek `accepted`, yeni `active` bağlantı;
        bağlantı vadesi 0 (önerilen vade yazılmaz, satıcı koşul ekranında öneri olarak görür; kullanıcı kararı
        2026-11-10). Başka perakendecinin isteği `404`; `pending` değilse
        `409 INVALID_STATE_TRANSITION`; süresi geçmişse `409 CONNECTION_REQUEST_EXPIRED`. Satıcı askıda veya
        salt-okunur olsa da kabul yapılır (SF-03).
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmDataSharing]
              additionalProperties: false
              properties:
                confirmDataSharing: { type: boolean, const: true }
      responses:
        '200':
          description: Bağlantı oluştu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/connection-requests/{id}/reject:
    post:
      tags: [connections]
      summary: İsteği reddet (US-023 AC3)
      description: İzin `connections.request.respond`. Bekleme süresi başlar. Başka perakendecinin isteği `404`; `pending` değilse `409 INVALID_STATE_TRANSITION`; süresi geçmişse `409 CONNECTION_REQUEST_EXPIRED`.
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: Reddedildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionRequest' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/connection-requests/{id}/withdraw:
    post:
      tags: [connections]
      summary: İsteği geri çek (US-022 AC1)
      description: |
        İzin `connections.request.send`. Temsilci (`assigned`) yalnız kendi gönderdiğini çeker; başkasınınki ve başka
        satıcının isteği `404`; `pending` değilse `409 INVALID_STATE_TRANSITION`. Kota iadesi yok (US-022 AC2).
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: Geri çekildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionRequest' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/connections:
    get:
      tags: [connections]
      summary: Bağlantılarım (seller veya buyer bakışı) (US-024 AC1, AC3)
      description: |
        İzin `connections.view`. Bakış işletmenin yeteneğinden: satıcıda karşı taraf perakendeci, alıcıda toptancı.
        Satıcıda `assigned` kapsamlı üye (temsilci) yalnız kendisine atanmış bağlantıları görür. Alıcı bakışında
        koşullardan yalnız `creditLimit` ve `paymentTermDays` döner; `suggestedTerms` yalnız satıcı bakışında ve
        koşul atanmamış aktif bağlantıda (önce önceki iptal edilmiş bağlantının atanmış koşulları, yoksa isteğin
        önerilen vadesi; F2.14a). Yeniden eskiye; `limit` en fazla 50.
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: status, in: query, schema: { type: string, enum: [active, cancelled] } }, { $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionPage' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/connections/sales-reps:
    get:
      tags: [connections]
      summary: Koşul ekranı için temsilci seçenekleri (US-024 AC2) — yalnızca seller
      description: |
        İzin `connections.terms.manage`. Satıcının satış temsilcisi rolündeki (`seller_sales_rep` şablonundan
        kopyalanan veya türetilen rol) aktif üyeleri; yalnız üyelik kimliği ve ad (telefon, rol yok).
        `PATCH .../terms` temsilci kuralıyla aynı küme (F2.14b; kullanıcı kararı 2026-11-10, B).
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [membershipId, fullName]
                      properties:
                        membershipId: { type: string, format: uuid }
                        fullName: { type: string }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/connections/{id}/terms:
    patch:
      tags: [connections]
      summary: Bağlantı koşulları (US-024 AC2) — yalnızca seller
      description: |
        İzin `connections.terms.manage` (yalnız `seller`, kapsam `all`; temsilci yalnız görür). Kısmi güncelleme,
        en az bir alan. Alıcı bu koşulları hiçbir yoldan değiştiremez (veritabanı bekçisi de reddeder). Fiyat
        listesi ve şube fiyatı F3.6'ya kadar kapalı: `priceListId` yalnız `null`, `branchPricingEnabled` yalnız
        `false`. Temsilci satıcının aktif üyesi olmalı (`422`). Başka işletmenin bağlantısı `404`; iptal edilmiş
        bağlantı `409 INVALID_STATE_TRANSITION`. Audit `connection.terms_updated`. Idempotency-Key gerekmez (PATCH).
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionTermsUpdate' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/connections/{id}/cancel:
    post:
      tags: [connections]
      summary: Bağlantıyı iptal et (US-025)
      description: |
        İzin `connections.cancel` (satıcı veya alıcı, kapsam `all`). Yalnız `active` bağlantı; çağıran tarafın
        gerekçesi ve ikinci onayı (`confirm: true`, yoksa `422 CONFIRMATION_REQUIRED`). Tek işlemde (F2.15a, SF-07):
        bağlantı `cancelled` (`ended_by_side` = çağıranın tarafı, `end_reason` = `reason`, `ended_at`,
        `ended_by_user_id`), `ConnectionCancelledHandler` kancaları (sepet kalemleri, `submitted` siparişler; F4.5),
        olay `connection.cancelled`, karşı tarafın aktif adminlerine bildirim, audit `connection.cancelled`
        (`note` yalnız audit'te, Mimar K1). Alıcı iptali bekleme süresi başlatır, satıcı iptali başlatmaz.
        Karşı taraf gerekçeyi görmez, yalnız `endedBySide` (K2). Başka çiftin bağlantısı `404`; iptal edilmiş
        bağlantı `409 INVALID_STATE_TRANSITION`.
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirm]
              additionalProperties: false
              properties:
                reason: { type: string, enum: [no_longer_working, payment_issue, quality_issue, other] }
                note: { type: string, maxLength: 500 }
                confirm: { type: boolean, const: true }
      responses:
        '200':
          description: İptal edildi
          content:
            application/json:
              schema:
                type: object
                required: [cancelledOrders]
                properties:
                  cancelledOrders: { type: integer, minimum: 0, description: 'İptal edilen `submitted` sipariş sayısı (F4.5 öncesi 0)' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/blocks:
    get:
      tags: [connections]
      summary: Engellenen toptancılar (buyer), yeniden eskiye
      description: İzin `connections.block` (F2.13a).
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BlockedSeller' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [connections]
      summary: Toptancıyı engelle (US-023 AC4)
      description: |
        İzin `connections.block`. Tek işlemde: engel kaydı, çiftin bekleyen isteği `rejected`, aktif bağlantısı
        `cancelled` (`ended_by_side = buyer`, `end_reason = blocked`, olay `connection.cancelled`). Yalnız çağıranla
        isteği, bağlantısı veya engeli olan satıcı; değilse `404`. Tekrar çağrı aynı kaydı döner (`201`).
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sellerId]
              additionalProperties: false
              properties:
                sellerId: { type: string, format: uuid }
      responses:
        '201':
          description: Engellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockedSeller' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/blocks/{sellerId}:
    delete:
      tags: [connections]
      summary: Engeli kaldır (US-023 AC5)
      description: İzin `connections.block`. Engel yoksa da `204`. Satıcı yeniden istek gönderebilir (bekleme süresi kurallarıyla).
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: sellerId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Kaldırıldı }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- catalog
  /api/v1/catalog/units:
    get:
