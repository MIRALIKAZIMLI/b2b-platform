  /api/v1/dev/sms-outbox:
    get:
      tags: [dev]
      summary: Mock SMS kutusu — yalnızca development ve staging (NFR-96). Production'da 404.
      security: []
      parameters: [ { name: phone, in: query, schema: { $ref: '#/components/schemas/PhoneE164' } } ]
      responses:
        '200': { description: Son 50 mesaj }
  /api/v1/dev/storage:
    put:
      tags: [dev]
      summary: Yerel dosya deposuna yükleme (STORAGE_PROVIDER=local, ADR-0023) — production'da yok
      description: |
        `token` (sorgu parametresi), `local` deposunun ürettiği imzalı (HMAC) ve süreli yükleme bağlantısıdır. İmza veya süre
        geçersizse, Content-Type ya da gövde boyutu imzadakinden farklıysa veya nesne zaten yazılmışsa
        (tek yazım, R2'de `If-None-Match: *`) 403.
      security: []
      parameters: [ { name: token, in: query, required: true, schema: { type: string } } ]
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Yüklendi }
        '403': { $ref: '#/components/responses/Error' }
    get:
      tags: [dev]
      summary: Yerel dosya deposundan okuma (imzalı, süreli) — production'da yok
      security: []
      parameters: [ { name: token, in: query, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Dosya içeriği
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BusinessId:
      name: X-Business-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    BusinessIdOptional:
      name: X-Business-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    XClient:
      name: X-Client
      in: header
      required: false
      description: >-
        `web` → yenileme anahtarı yanıt gövdesinde dönmez, `b2b_rt` httpOnly cookie'sine yazılır
        (ADR-0006 madde 3, TM-04; F1.13a). Mobil başlığı göndermez; davranışı değişmez.
      schema: { type: string, enum: [web] }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: false
      description: >-
        Cookie ile yenilemede zorunlu (boş olmayan herhangi bir değer; web `fetch` gönderir); yoksa
        anahtar tüketilmeden `401 UNAUTHENTICATED` (CSRF, TM-21; F1.13a).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 64 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    SetRefreshCookie:
      description: >-
        Yalnızca web (`X-Client: web` veya cookie ile yenileme):
        `b2b_rt=<anahtar>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=<auth.refresh_token_days>`.
        `Domain` yok; web API'yi kendi kökeninden çağırır (Next rewrite). Silme: aynı bayraklarla
        `b2b_rt=; Max-Age=0`.
      schema: { type: string }
  responses:
    Error:
      description: Hata
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: Accept-Language dilinde }
        requestId: { type: string }
        details:
          type: object
          description: "Örn. alan hataları { field: [mesaj] }, retryAfter, available"
          additionalProperties: {}
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - PERMISSION_DENIED
        - CAPABILITY_REQUIRED
        - NOT_FOUND
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - CONFIRMATION_REQUIRED
        - OTP_RATE_LIMITED
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_LOCKED
        - SMS_UNAVAILABLE
        - TOTP_REQUIRED
        - TOTP_INVALID
        - REFRESH_TOKEN_REUSED
        - USER_DISABLED
        - BUSINESS_SUSPENDED
        - SUBSCRIPTION_READ_ONLY
        - ENTITLEMENT_LIMIT_REACHED
        - VOEN_INVALID
        - VOEN_ALREADY_REGISTERED
        - VOEN_REQUIRED
        - LAST_ADMIN_PROTECTED
        - CONNECTION_ALREADY_ACTIVE
        - CONNECTION_REQUEST_ALREADY_PENDING
        - CONNECTION_REQUEST_EXPIRED
        - CONNECTION_BLOCKED
        - CONNECTION_COOLDOWN_ACTIVE
        - CONNECTION_DAILY_QUOTA_EXCEEDED
        - CONNECTION_NOT_ACTIVE
        - PRICE_NOT_AVAILABLE
        - QTY_NOT_MULTIPLE
        - BELOW_MIN_ORDER_QTY
        - BELOW_MIN_ORDER_AMOUNT
        - VARIANT_UNAVAILABLE
        - CURRENCY_MISMATCH
        - STOCK_INSUFFICIENT
        - ORDER_QTY_INCREASE_NOT_ALLOWED
        - ORDER_EMPTY_USE_REJECT
        - DELIVERY_PHOTO_REQUIRED
        - DELIVERY_TIMESTAMP_TOO_OLD
        - FILE_INVALID
        - IMPORT_TOO_MANY_ROWS
        - SETTING_OUT_OF_RANGE
        - INTERNAL_ERROR
    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      examples: ['+994501234567']
    Voen:
      type: string
      pattern: '^[0-9]{9}[12]$'
    LanguageCode:
      type: string
      enum: [az, ru, tr, en]
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [AZN]
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,4})?$'
      examples: ['12.50']
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    Region:
      type: object
      required: [id, countryCode, parentId, type, name]
      properties:
        id: { type: string, format: uuid }
        countryCode: { type: string, pattern: '^[A-Z]{2}$', examples: [AZ] }
        parentId: { type: [string, 'null'], format: uuid, description: Rayonun bağlı olduğu şehir }
        type: { type: string, enum: [city, district] }
        name: { $ref: '#/components/schemas/LocalizedText' }
    LocalizedText:
      type: object
      properties:
        az: { type: string }
        ru: { type: string }
        tr: { type: string }
        en: { type: string }
      minProperties: 1
    DeviceInfo:
      type: object
      properties:
        type: { type: string, enum: [web, ios, android] }
        name: { type: string }
        appVersion: { type: string }
    TokenPair:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: saniye (900) }
        refreshToken: { type: string, description: Yalnızca mobil; web'de cookie }
    AuthResult:
      type: object
      description: >-
        nextStep = none iken accessToken ve expiresIn dolu (oturum açıldı). nextStep = register iken
        oturum açılmaz; accessToken yok, pendingToken kayıt için kısa ömürlü anahtardır (F1.5b).
      required: [nextStep, memberships]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: saniye (900) }
        refreshToken: { type: string, description: Yalnızca mobil; web'de cookie }
        nextStep: { type: string, enum: [none, register, totp, totp_setup] }
        pendingToken:
          type: string
          description: >-
            nextStep = register (kayıt, F2.3; telefonu taşır, 15 dk) veya totp / totp_setup (yalnızca
            /auth/totp/* uçlarında geçerli ön oturum, F1.6) ise. Erişim anahtarı olarak kabul edilmez.
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceType: { type: string }
        deviceName: { type: string }
        city: { type: string }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    MembershipSummary:
      type: object
      properties:
        membershipId: { type: string, format: uuid, description: F1.8b }
        businessId: { type: string, format: uuid }
        businessName: { type: string }
        businessStatus:
          type: string
          enum: [active, suspended, dormant, archived]
          description: "F1.8b: askıdaki / arşivli işletme listede görünür ama işletme bağlamlı uçlar 403 BUSINESS_SUSPENDED döner"
        capability: { type: string, enum: [seller, buyer] }
        roleName: { type: string }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        preferredLanguage: { $ref: '#/components/schemas/LanguageCode' }
        timezone: { type: [string, 'null'] }
        platformRole: { type: [string, 'null'] }
        totpEnabled: { type: boolean, description: TOTP kurulu ve etkin mi (F1.6) }
        twoFactorRecommended:
          type: boolean
          description: "Kullanıcının aktif bir işletme admini üyeliği var ve TOTP kurulu değil (US-002 AC3, F1.8b)"
        memberships: { type: array, items: { $ref: '#/components/schemas/MembershipSummary' } }
        activeBusiness:
          type: object
          properties:
            id: { type: string, format: uuid }
            capability:
              type: [string, 'null']
              enum: [seller, buyer, null]
              description: "Rolün yeteneği, işletmede onaylıysa. Yetenek onaylı değilse (beklemede / askıda) null; bu durumda işletme bağlamlı uçlar 403 CAPABILITY_REQUIRED döner (F1.8b)."
            timezone: { type: string }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
            permissions:
              type: array
              items: { $ref: '#/components/schemas/RolePermission' }
            subscriptionStatus: { type: string }
    RolePermission:
      type: object
      required: [code, scope]
      properties:
        code: { type: string, examples: [orders.approve] }
        scope: { type: string, enum: [all, branch, warehouse, assigned] }
    Business:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalName: { type: string }
        voen: { type: [string, 'null'] }
        legalType: { type: [string, 'null'] }
        regionId: { type: string, format: uuid }
        addressLine: { type: [string, 'null'] }
        businessPhone: { type: [string, 'null'] }
        logoUrl: { type: [string, 'null'] }
        status: { type: string }
        verified: { type: boolean }
        profileCompleteness: { type: integer }
        timezone: { type: string }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    BusinessUpdate:
      type: object
      properties:
        legalName: { type: string }
        voen: { $ref: '#/components/schemas/Voen' }
        regionId: { type: string, format: uuid }
        addressLine: { type: string }
        businessPhone: { type: string }
        logoFileId: { type: string, format: uuid }
        contactName: { type: string }
        personalPhone: { $ref: '#/components/schemas/PhoneE164' }
        email: { type: string, format: email }
    Privacy:
      type: object
      properties:
        listedInDirectory: { type: boolean }
        showLogo: { type: boolean }
        showAddress: { type: boolean }
        showBusinessPhone: { type: boolean }
        showVoen: { type: boolean }
        showContactName: { type: boolean }
        showPersonalContact: { type: boolean }
    Branch:
      allOf:
        - $ref: '#/components/schemas/BranchInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
    BranchInput:
      type: object
      required: [name, regionId, addressLine]
      properties:
        name: { type: string }
        regionId: { type: string, format: uuid }
        addressLine: { type: string }
        lat: { type: number }
        lng: { type: number }
        approvalRule: { type: string, enum: [every_order, above_amount, none] }
        approvalThreshold: { $ref: '#/components/schemas/Decimal' }
        status: { type: string, enum: [active, inactive] }
    DirectoryBuyer:
      type: object
      description: Yalnızca görünürlük ayarına göre açık alanlar dolu döner. Diğer bağlantılar asla dönmez.
      required: [id, legalName, activityType, region]
      properties:
        id: { type: string, format: uuid }
        legalName: { type: string }
        activityType: { type: string }
        region: { type: string }
        verified: { type: boolean }
        logoUrl: { type: [string, 'null'] }
        addressLine: { type: [string, 'null'] }
        businessPhone: { type: [string, 'null'] }
        voen: { type: [string, 'null'] }
        contactName: { type: [string, 'null'] }
        relation:
          type: object
          description: Bu satıcıyla ilişki durumu
          properties:
            status: { type: string, enum: [none, pending, active, rejected, cancelled, blocked] }
            cooldownUntil: { type: [string, 'null'], format: date-time }
            canRequest: { type: boolean }
    ConnectionRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        buyerId: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, rejected, expired, withdrawn] }
        message: { type: [string, 'null'] }
        proposedPaymentTermDays: { type: [integer, 'null'] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    Connection:
      type: object
      properties:
        id: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        buyerId: { type: string, format: uuid }
        counterpartyName: { type: string }
        status: { type: string, enum: [active, cancelled] }
        terms: { $ref: '#/components/schemas/ConnectionTerms' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        endedBySide: { type: [string, 'null'] }
    ConnectionTerms:
      type: object
      properties:
        priceListId: { type: [string, 'null'], format: uuid }
        branchPricingEnabled: { type: boolean }
        creditLimit: { type: [string, 'null'] }
        paymentTermDays: { type: integer, minimum: 0, maximum: 180 }
        salesRepMembershipId: { type: [string, 'null'], format: uuid }
    Notification:
      type: object
      required: [id, type, businessId, title, body, data, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        businessId: { type: [string, 'null'], format: uuid }
        title: { type: string }
        body: { type: string }
        data:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Packaging:
      type: object
      required: [level, unitCode, baseQty]
      properties:
        id: { type: string, format: uuid }
        level: { type: string, enum: [unit, inner, case, pallet] }
        unitCode: { type: string, examples: [XCT] }
        baseQty: { $ref: '#/components/schemas/Decimal' }
        gtin: { type: [string, 'null'] }
        isSalesUnit: { type: boolean }
        minOrderQty: { $ref: '#/components/schemas/Decimal' }
        orderMultiple: { $ref: '#/components/schemas/Decimal' }
        weightG: { type: [integer, 'null'] }
    Variant:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        attributes: { type: object, additionalProperties: {} }
        gtin: { type: [string, 'null'] }
        isAvailable: { type: boolean }
        packaging: { type: array, items: { $ref: '#/components/schemas/Packaging' } }
    ProductInput:
      type: object
      required: [sku, name, categoryId, baseUnitCode, variants]
      properties:
        sku: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        categoryId: { type: string, format: uuid }
        brandId: { type: [string, 'null'], format: uuid }
        baseUnitCode: { type: string }
        hasExpiry: { type: boolean }
        shelfLifeMonths: { type: [integer, 'null'] }
        status: { type: string, enum: [draft, active, archived] }
        imageFileIds: { type: array, maxItems: 8, items: { type: string, format: uuid } }
        variants: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Variant' } }
        visibility:
          type: object
          properties:
            priceListIds: { type: array, items: { type: string, format: uuid } }
            regionIds: { type: array, items: { type: string, format: uuid } }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            images: { type: array, items: { type: object, properties: { thumb: { type: string }, medium: { type: string }, large: { type: string } } } }
    BrowseProduct:
      type: object
      properties:
        productId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        packagingId: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        sellerName: { type: string }
        name: { type: string, description: İstek dilinde (geri dönüşlü) }
        brand: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        salesUnit: { type: string }
        baseQtyPerUnit: { $ref: '#/components/schemas/Decimal' }
        minOrderQty: { $ref: '#/components/schemas/Decimal' }
        orderMultiple: { $ref: '#/components/schemas/Decimal' }
        price: { $ref: '#/components/schemas/ResolvedPrice' }
        stock:
          type: object
          properties:
            state: { type: string, enum: [untracked, in_stock, low, out_of_stock] }
            lowQty: { type: [string, 'null'] }
        isFavorite: { type: boolean }
    ResolvedPrice:
      type: object
      properties:
        unitPrice: { $ref: '#/components/schemas/Money' }
        source: { type: string, enum: [branch_price, customer_price, price_list, default_list, none] }
        tierDiscountPercent: { $ref: '#/components/schemas/Decimal' }
        branchDiscountPercent: { $ref: '#/components/schemas/Decimal' }
        finalUnitPrice: { $ref: '#/components/schemas/Money' }
        vatIncluded: { type: boolean }
        vatRate: { $ref: '#/components/schemas/Decimal' }
    PriceListInput:
      type: object
      required: [name, currency, vatIncluded, vatRate]
      properties:
        name: { type: string }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        vatIncluded: { type: boolean }
        vatRate: { $ref: '#/components/schemas/Decimal' }
        isDefault: { type: boolean }
    BranchDiscountInput:
      type: object
      required: [buyerId, branchId, target, percent]
      properties:
        buyerId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        target: { type: string, enum: [all, brand, category] }
        brandId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        percent: { $ref: '#/components/schemas/Decimal' }
        validFrom: { type: string, format: date-time }
        validTo: { type: [string, 'null'], format: date-time }
    Cart:
      type: object
      properties:
        branchId: { type: string, format: uuid }
        status: { type: string, enum: [open, pending_approval] }
        approvalRequired: { type: boolean }
        groups:
          type: array
          items:
            type: object
            properties:
              sellerId: { type: string, format: uuid }
              sellerName: { type: string }
              connectionActive: { type: boolean }
              subtotal: { $ref: '#/components/schemas/Money' }
              minOrderAmount: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
              belowMinimum: { type: boolean }
              creditLimitWarning: { type: boolean }
              items:
                type: array
                items:
                  type: object
                  properties:
                    packagingId: { type: string, format: uuid }
                    name: { type: string }
                    qty: { $ref: '#/components/schemas/Decimal' }
                    price: { $ref: '#/components/schemas/ResolvedPrice' }
                    lineTotal: { $ref: '#/components/schemas/Money' }
                    priceChanged: { type: boolean }
                    addedBy: { type: string }
    SubmitResult:
      type: object
      properties:
        orders:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              number: { type: string }
              sellerId: { type: string, format: uuid }
              total: { $ref: '#/components/schemas/Money' }
        skippedGroups:
          type: array
          items:
            type: object
            properties:
              sellerId: { type: string, format: uuid }
              reason: { $ref: '#/components/schemas/ErrorCode' }
    OrderStatus:
      type: string
      enum: [submitted, approved, rejected, cancelled, preparing, ready_to_ship, shipped, delivered_pending_confirmation, disputed, delivered]
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        sellerId: { type: string, format: uuid }
        sellerName: { type: string }
        buyerId: { type: string, format: uuid }
        buyerName: { type: string }
        branchId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        subtotal: { $ref: '#/components/schemas/Decimal' }
        discountTotal: { $ref: '#/components/schemas/Decimal' }
        vatTotal: { $ref: '#/components/schemas/Decimal' }
        total: { $ref: '#/components/schemas/Decimal' }
        paymentTermDays: { type: integer }
        submittedAt: { type: string, format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        autoConfirmAt: { type: [string, 'null'], format: date-time }
        autoConfirmed: { type: boolean }
        deliverySnapshot: { type: object, additionalProperties: {} }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              unitCode: { type: string }
              qtyOrdered: { $ref: '#/components/schemas/Decimal' }
              qtyApproved: { type: [string, 'null'] }
              unitPrice: { $ref: '#/components/schemas/Decimal' }
              priceSource: { type: string }
              tierDiscountPercent: { $ref: '#/components/schemas/Decimal' }
              branchDiscountPercent: { $ref: '#/components/schemas/Decimal' }
              lineTotal: { $ref: '#/components/schemas/Decimal' }
              lotNo: { type: [string, 'null'] }
              expiryDate: { type: [string, 'null'], format: date }
        history:
          type: array
          items:
            type: object
            properties:
              from: { type: [string, 'null'] }
              to: { type: string }
              at: { type: string, format: date-time }
              actor: { type: string }
              note: { type: [string, 'null'] }
    Balance:
      type: object
      properties:
        counterpartyId: { type: string, format: uuid }
