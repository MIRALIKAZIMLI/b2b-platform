    get:
      tags: [pricing]
      summary: Bir alıcı için fiyatın kaynağını göster (US-034 AC5)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: buyerId, in: query, required: true, schema: { type: string, format: uuid } }, { name: branchId, in: query, schema: { type: string, format: uuid } }, { name: packagingId, in: query, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: Çözümleme adımları
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedPrice' }

  # ---------------------------------------------------------------- inventory
  /api/v1/stock:
    get:
      tags: [inventory]
      summary: Stok (seller)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: warehouseId, in: query, schema: { type: string, format: uuid } }, { name: low, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: Liste }
  /api/v1/stock/movements:
    post:
      tags: [inventory]
      summary: Mal girişi veya sayım düzeltmesi (US-039)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, variantId, type, qty]
              properties:
                warehouseId: { type: string, format: uuid }
                variantId: { type: string, format: uuid }
                type: { type: string, enum: [receipt, adjustment] }
                qty: { $ref: '#/components/schemas/Decimal' }
                lotNo: { type: string }
                expiryDate: { type: string, format: date }
                note: { type: string }
      responses:
        '201': { description: Kaydedildi }
  /api/v1/variants/{id}/availability:
    put:
      tags: [inventory]
      summary: Var / yok işaretle (US-038)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [isAvailable]
              properties:
                isAvailable: { type: boolean }
      responses:
        '200': { description: Güncellendi }

  # ---------------------------------------------------------------- cart
  /api/v1/cart:
    get:
      tags: [cart]
      summary: Şube sepeti (US-040)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: branchId, in: query, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: Satıcıya göre gruplu sepet, güncel fiyatlarla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /api/v1/cart/items:
    put:
      tags: [cart]
      summary: Kalem ekle / miktar güncelle (0 = sil)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [branchId, packagingId, qty]
              properties:
                branchId: { type: string, format: uuid }
                packagingId: { type: string, format: uuid }
                qty: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200':
          description: Güncel sepet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/cart/submit:
    post:
      tags: [cart]
      summary: Sepeti gönder veya onaya gönder (US-041, US-042)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [branchId]
              properties:
                branchId: { type: string, format: uuid }
      responses:
        '200':
          description: Onay gerekmedi; siparişler oluştu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResult' }
        '202':
          description: Şube onayı bekleniyor
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/cart/approve:
    post:
      tags: [cart]
      summary: Şube admini onaylar ve gönderir (US-041)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [branchId]
              properties:
                branchId: { type: string, format: uuid }
      responses:
        '200':
          description: Siparişler oluştu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmitResult' }
  /api/v1/cart/return:
    post:
      tags: [cart]
      summary: Şube admini sepeti geri gönderir (US-041 AC3)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [branchId, note]
              properties:
                branchId: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: Geri gönderildi }

  # ---------------------------------------------------------------- orders
  /api/v1/orders:
    get:
      tags: [orders]
      summary: Siparişler (seller veya buyer bakışı)
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/OrderStatus' } } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
        - { name: counterpartyId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Liste }
  /api/v1/orders/{id}:
    get:
      tags: [orders]
      summary: Sipariş detayı
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Sipariş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/approve:
    post:
      tags: [orders]
      summary: Tam veya kısmi onay (US-043)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lines:
                  type: array
                  description: Boşsa tüm satırlar istenen miktarla onaylanır
                  items:
                    type: object
                    required: [itemId, qtyApproved]
                    properties:
                      itemId: { type: string, format: uuid }
                      qtyApproved: { $ref: '#/components/schemas/Decimal' }
                      reason: { type: string }
                      lotNo: { type: string }
                      expiryDate: { type: string, format: date }
      responses:
        '200': { description: Onaylandı }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/reject:
    post:
      tags: [orders]
      summary: Reddet (US-043)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Reddedildi }
  /api/v1/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: İptal (buyer yalnızca submitted; seller approved/preparing)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: İptal edildi }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/prepare:
    post:
      tags: [orders]
      summary: Hazırlanıyor (US-043 AC5)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Güncellendi }
  /api/v1/orders/{id}/confirm-delivery:
    post:
      tags: [orders]
      summary: Perakendeci teslimi onaylar (US-048)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: Teslim kesinleşti }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{id}/dispute:
    post:
      tags: [orders]
      summary: Perakendeci itiraz eder (US-048)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, description]
              properties:
                type: { type: string, enum: [missing, damaged, not_received] }
                description: { type: string, maxLength: 1000 }
                fileId: { type: string, format: uuid }
      responses:
        '201': { description: İtiraz açıldı }
  /api/v1/orders/{id}/resolve-dispute:
    post:
      tags: [orders]
      summary: Toptancı itirazı çözer (US-048 AC4)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [accept, reject] }
                note: { type: string, maxLength: 1000 }
                lines:
                  type: array
                  items:
                    type: object
                    required: [itemId, qtyDelivered]
                    properties:
                      itemId: { type: string, format: uuid }
                      qtyDelivered: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200': { description: Çözüldü }
  /api/v1/orders/{id}/document:
    post:
      tags: [documents]
      summary: Sipariş belgesi PDF üret / getir (US-044)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Hazır; süreli indirme bağlantısı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRef' }
        '202': { description: Üretiliyor; tekrar sorgulayın }
  /api/v1/orders/{id}/einvoice-number:
    put:
      tags: [orders]
      summary: e-qaimə numarasını elle gir (US-053 AC2)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [einvoiceNumber]
              properties:
                einvoiceNumber: { type: string, maxLength: 50 }
      responses:
        '200': { description: Kaydedildi }
  /api/v1/orders/{id}/reorder:
    post:
      tags: [orders]
      summary: Tekrar sipariş — kalemleri sepete ekler (US-045)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Eklenen ve eklenemeyen kalemler }

  # ---------------------------------------------------------------- delivery
  /api/v1/orders/{id}/delivery:
    post:
      tags: [delivery]
      summary: Kargocu ata veya dış kargoya ver (US-046, US-049)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [provider, courierMembershipId]
                  properties:
                    provider: { const: own_courier }
                    courierMembershipId: { type: string, format: uuid }
                - type: object
                  required: [provider, carrierName, trackingNo]
                  properties:
                    provider: { const: manual_carrier }
                    carrierName: { type: string }
                    trackingNo: { type: string }
      responses:
        '201': { description: Teslimat oluştu }
  /api/v1/deliveries/mine:
    get:
      tags: [delivery]
      summary: Kargocunun teslimatları (US-046 AC3)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: status, in: query, schema: { type: string } } ]
      responses:
        '200': { description: Liste }
  /api/v1/deliveries/{id}/depart:
    post:
      tags: [delivery]
      summary: Yola çıktım
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Güncellendi }
  /api/v1/deliveries/{id}/delivered:
    post:
      tags: [delivery]
      summary: Teslim ettim (US-047)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                photoFileId: { type: string, format: uuid }
                lat: { type: number }
                lng: { type: number }
                deliveredAt: { type: string, format: date-time, description: Çevrimdışı gönderimde istemci zamanı }
                cashCollected:
                  type: object
                  properties:
                    amount: { $ref: '#/components/schemas/Decimal' }
                    currency: { $ref: '#/components/schemas/CurrencyCode' }
      responses:
        '200': { description: Onay bekliyor }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/deliveries/{id}/failed:
    post:
      tags: [delivery]
      summary: Teslim edilemedi (US-047 AC4)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [closed, not_reachable, refused, address_wrong, other] }
                lat: { type: number }
                lng: { type: number }
      responses:
        '200': { description: Kaydedildi }

  # ---------------------------------------------------------------- ledger
  /api/v1/ledger/balances:
    get:
      tags: [ledger]
      summary: Karşı taraf bazında bakiyeler (US-050)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200':
          description: Bakiyeler (para birimine göre)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Balance' } }
                  nextCursor: { type: [string, 'null'] }
  /api/v1/ledger/entries:
    get:
      tags: [ledger]
      summary: Bir karşı tarafla cari hareketleri
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: counterpartyId, in: query, required: true, schema: { type: string, format: uuid } }, { name: currency, in: query, schema: { $ref: '#/components/schemas/CurrencyCode' } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: Hareketler }
  /api/v1/payments:
    post:
      tags: [ledger]
      summary: Tahsilat gir (US-051) — yalnızca seller
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [buyerId, amount, currency, method, receivedAt]
              properties:
                buyerId: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/Decimal' }
                currency: { $ref: '#/components/schemas/CurrencyCode' }
                method: { type: string, enum: [cash, bank_transfer, card] }
                receivedAt: { type: string, format: date-time }
                note: { type: string }
      responses:
        '201': { description: Kaydedildi (posted veya pending_review) }
  /api/v1/payments/{id}/review:
    post:
      tags: [ledger]
      summary: Temsilci tahsilatını onayla / reddet (US-051 AC4)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [post, reject] }
      responses:
        '200': { description: Güncellendi }
  /api/v1/courier-cash:
    get:
      tags: [ledger]
      summary: Kargocularda bekleyen nakit (US-051 AC2)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      responses:
        '200': { description: Liste }
  /api/v1/courier-cash/{id}/hand-over:
    post:
      tags: [ledger]
      summary: Nakit teslim alındı (US-051 AC3)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Kapandı }
  /api/v1/statements:
    post:
      tags: [documents]
      summary: Ekstre PDF iste (US-052)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [counterpartyId, from, to]
              properties:
                counterpartyId: { type: string, format: uuid }
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        '202':
          description: Üretiliyor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRef' }
  /api/v1/documents/{id}:
    get:
      tags: [documents]
      summary: Belge durumu ve süreli indirme bağlantısı
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Belge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRef' }
  /api/v1/exports/einvoice:
    post:
      tags: [documents]
      summary: e-qaimə uyumlu .xlsx dışa aktarma (US-053)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        '202':
          description: Üretiliyor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRef' }
        '403': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- imports & files
  /api/v1/imports:
    post:
      tags: [imports]
      summary: Excel içe aktarma başlat (US-031)
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, fileId]
              properties:
                type: { type: string, enum: [products, customer_prices, stock] }
                fileId: { type: string, format: uuid }
      responses:
        '202':
          description: İş oluştu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
  /api/v1/imports/template:
    get:
      tags: [imports]
      summary: Şablon .xlsx indirme bağlantısı
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: type, in: query, required: true, schema: { type: string, enum: [products, customer_prices, stock] } } ]
      responses:
        '200': { description: Süreli bağlantı }
  /api/v1/imports/{id}:
    get:
      tags: [imports]
      summary: İş durumu ve önizleme
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: İş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
  /api/v1/imports/{id}/apply:
    post:
      tags: [imports]
      summary: Önizlemeyi uygula
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '202': { description: Uygulanıyor }
  /api/v1/files/upload-url:
    post:
      tags: [files]
      summary: Süreli imzalı yükleme URL'si (SF-09, NFR-49)
      description: |
        İzin `purpose`'a göre (F1.10): product_image → catalog.manage; logo → business.manage;
        delivery_photo → delivery.update_own; dispute_photo → orders.confirm_delivery veya
        orders.resolve_dispute; import → imports.run. Tür veya boyut sınırı aşılırsa 422 FILE_INVALID.
        Platform dosyası yüklemesi bu uçta yok (F1.10 kararı); X-Business-Id zorunlu.
      parameters: [ { $ref: '#/components/parameters/BusinessId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [purpose, contentType, sizeBytes]
              properties:
                purpose: { type: string, enum: [product_image, logo, delivery_photo, dispute_photo, import] }
                contentType: { type: string }
                sizeBytes: { type: integer }
      responses:
        '200':
          description: URL
          content:
            application/json:
              schema:
                type: object
                required: [fileId, uploadUrl, method, headers, expiresAt]
                properties:
                  fileId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
                  method: { type: string, enum: [PUT] }
                  headers: { type: object, additionalProperties: { type: string } }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/files/{id}/complete:
    post:
      tags: [files]
      summary: Yüklemeyi tamamla ve doğrula (boyut + ilk 16 bayt imzası)
      description: |
        Dosyayı oluşturan işletmenin bağlamında çağrılır; başka işletmenin dosyası 404.
        Geçersiz dosya → nesne silinir, satır rejected, 422 FILE_INVALID. Aynı dosya için
        tekrar çağrı mevcut durumu döner (ready → 200, rejected → 422).
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Hazır
          content:
            application/json:
              schema:
                type: object
                required: [fileId, status, contentType, sizeBytes]
                properties:
                  fileId: { type: string, format: uuid }
                  status: { type: string, enum: [ready] }
                  contentType: { type: string }
                  sizeBytes: { type: integer }
                  url: { type: string, format: uri, description: Yalnızca public dosyada CDN adresi }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- notifications
  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: Uygulama içi bildirimler (US-054 AC1; en yeni önce)
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/notifications/read:
    post:
      tags: [notifications]
      summary: Okundu işaretle
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
                all: { type: boolean }
      responses:
        '204': { description: Güncellendi }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/notifications/preferences:
    put:
      tags: [notifications]
      summary: Bildirim tercihleri (US-054 AC2); anahtar bildirim türü, değer push açık mı
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
      responses:
        '200':
          description: Güncellendi; tüm türlerin güncel tercihi
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/push-tokens:
    post:
      tags: [notifications]
      summary: Cihaz push anahtarını kaydet (anahtar başka kullanıcıdaysa bu kullanıcıya taşınır)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, maxLength: 255, description: 'ExponentPushToken[...]' }
                platform: { type: string, enum: [ios, android] }
      responses:
        '204': { description: Kaydedildi }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- dashboard & system
  /api/v1/dashboard:
    get:
      tags: [dashboard]
      summary: Rol bazlı dashboard kartları (US-056)
      parameters: [ { $ref: '#/components/parameters/BusinessId' }, { name: range, in: query, schema: { type: string, enum: [today, week, month, custom], default: today } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } } ]
      responses:
        '200':
          description: Kartlar
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards: { type: array, items: { $ref: '#/components/schemas/DashboardCard' } }
  /api/v1/i18n/{lang}:
    get:
      tags: [system]
      summary: Arayüz çevirileri (önbelleklenebilir, ETag; US-058, F1.3)
      description: |
        Dilin bütün arayüz anahtarları. Dilde eksik olan anahtar varsayılan dilin (az) değeriyle
        gelir (US-058 AC3). Yanıt `Cache-Control: no-cache` taşır: istemci önbelleğini her
        kullanımda `If-None-Match` ile doğrular; değişiklik yoksa `304`.
      security: []
      parameters:
        - name: lang
          in: path
          required: true
          description: |
            Dil kodu. `languages` tablosunda olmayan (ör. `xx`) veya pasif (`is_active = false`)
            dil `404 NOT_FOUND` döner; bu yüzden şema enum değildir.
          schema: { type: string, examples: [az, ru, tr] }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Anahtar → metin sözlüğü
          headers:
            ETag: { description: Sözlüğün sürüm özeti (güçlü ETag), schema: { type: string } }
            Cache-Control: { schema: { type: string, examples: [no-cache] } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
        '304':
          description: İstemcideki sürüm güncel (gövde yok)
          headers:
            ETag: { schema: { type: string } }
        '404': { $ref: '#/components/responses/Error' }
  /api/app-config:
    get:
      tags: [system]
      summary: Mobil minimum sürüm ve genel ayarlar (US-060) — sürümsüz uç nokta
      security: []
      parameters: [ { name: platform, in: query, required: true, schema: { type: string, enum: [ios, android] } }, { name: version, in: query, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Yapılandırma
          content:
            application/json:
              schema:
                type: object
                properties:
                  minVersion: { type: string }
                  recommendedVersion: { type: string }
                  updateRequired: { type: boolean }
                  storeUrl: { type: string, format: uri, description: 'Mağaza veya test dağıtım bağlantısı; ayarlanmamışsa alan yok (F1.14b)' }
                  maintenance: { type: boolean }
                required: [minVersion, recommendedVersion, updateRequired, maintenance]
        '422': { $ref: '#/components/responses/Error' }
  /api/health:
    get:
      tags: [system]
      summary: Sağlık kontrolü (veritabanı ve Redis)
      security: []
      responses:
        '200': { description: Sağlıklı }
        '503': { description: Bağımlılık erişilemiyor }

  # ---------------------------------------------------------------- admin (platform)
  /api/v1/admin/sellers:
    get:
      tags: [admin]
      summary: Toptancılar (platform rolü super_admin, operations)
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200':
          description: Liste (yeniden eskiye)
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminSeller' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: Toptancı aç (US-009; platform rolü super_admin, operations)
      description: >
        Tek işlemde işletme (`created_via = admin`, `active`), `seller` yeteneği (`approved`),
        satıcı profili, hizmet bölgeleri, seçilen planın aboneliği, işletme admin rolü, yetkilinin
        kullanıcı kaydı (yoksa) ve aktivasyon daveti (`invitation.seller_activation_days`) oluşur.
        Aktivasyon SMS'i işlemden sonra gider; gönderilemezse işletme yine oluşur ve
        `activationSmsSent: false` döner. Aynı VÖEN herhangi bir işletmede kayıtlıysa `409`.
        `applicationId` verilirse (F2.2) başvuru aynı işlemde `approved` olur ve işletmeye bağlanır;
        başvuru yoksa `404`, `pending` değilse `409 INVALID_STATE_TRANSITION`.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legalName, voen, regionId, ownerPhone, ownerName, planId, currency, timezone]
              properties:
                legalName: { type: string, minLength: 1, maxLength: 200 }
                voen: { $ref: '#/components/schemas/Voen' }
                regionId: { type: string, format: uuid }
                addressLine: { type: string, maxLength: 300 }
                ownerPhone: { $ref: '#/components/schemas/PhoneE164' }
                ownerName: { type: string, minLength: 1, maxLength: 120 }
                planId: { type: string, format: uuid }
                serviceAreaRegionIds: { type: array, maxItems: 200, items: { type: string, format: uuid } }
                currency: { $ref: '#/components/schemas/CurrencyCode' }
                timezone: { type: string, description: IANA saat dilimi adı }
                applicationId: { type: string, format: uuid, description: Başvurudan açma (F2.2, US-008) }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                type: object
                required: [businessId, invitationExpiresAt, activationSmsSent]
                properties:
                  businessId: { type: string, format: uuid }
                  invitationExpiresAt: { type: string, format: date-time }
                  activationSmsSent: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/sellers/{id}/activation:
    post:
      tags: [admin]
      summary: Yeni aktivasyon daveti gönder (US-009 AC3)
      description: >
        İşletmenin açık admin davetleri geçersiz olur, aynı yetkiliye yeni davet ve SMS gider.
        İşletmede aktif admin üyeliği varsa `409 INVALID_STATE_TRANSITION`; toptancı yoksa `404`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Yeni davet oluşturuldu
          content:
            application/json:
              schema:
                type: object
                required: [invitationExpiresAt, activationSmsSent]
                properties:
                  invitationExpiresAt: { type: string, format: date-time }
                  activationSmsSent: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/seller-applications:
    get:
      tags: [admin]
      summary: Toptancı başvuruları (US-008 AC1; platform rolü super_admin, operations)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected], default: pending } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Liste (yeniden eskiye)
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SellerApplication' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/seller-applications/{id}/reject:
    post:
      tags: [admin]
      summary: Başvuruyu reddet (platform rolü super_admin, operations)
      description: Yalnızca `pending` başvuru; değilse `409 INVALID_STATE_TRANSITION`, yoksa `404`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Reddedildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerApplication' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/buyers:
    get:
      tags: [admin]
      summary: "Perakendeciler (F2.18, US-015 AC1; platform rolü super_admin, operations, support)"
      description: >
        Filtre: `all` (arşivliler hariç), `voen_pending` (VÖEN girilmiş, doğrulanmamış; moderasyon
        kuyruğu), `dormant` (bağlantısız hesap aşaması, F2.17 doldurur), `suspended`. Yeniden eskiye.
      parameters: [ { name: filter, in: query, schema: { type: string, enum: [all, voen_pending, dormant, suspended], default: all } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminBuyer' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/buyers/{id}:
    get:
      tags: [admin]
      summary: "Perakendeci kaydı (F2.18, US-015 AC1; super_admin, operations, support)"
      description: Toptancı, arşivli veya olmayan kayıt `404`. e-taxes.gov.az bağlantısı istemcide.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Kayıt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBuyer' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/buyers/{id}/verify:
    post:
      tags: [admin]
      summary: "VÖEN doğrula / reddet (F2.18, US-015 AC2; super_admin, operations)"
      description: >
        `verify`: `verified_at`, `verified_by` yazılır; dizinde rozet ve üstte sıralama.
        `reject`: VÖEN (ve türetilen hukuki tip) temizlenir; perakendecinin aktif adminlerine
        `voen_rejected` bildirimi (metin gerekçe koduna göre). Gerekçe sabit kod listesidir (outbox
        yükü ve bildirim serbest metin taşımaz, ADR-0010 §3); `note` yalnız audit'e yazılır.
        VÖEN yoksa `422 VOEN_REQUIRED`; zaten doğrulanmışsa `409 INVALID_STATE_TRANSITION`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [decision]
                  properties:
                    decision: { type: string, const: verify }
                - type: object
                  additionalProperties: false
                  required: [decision, reason]
                  properties:
                    decision: { type: string, const: reject }
                    reason: { type: string, enum: [voen_not_found, name_mismatch, voen_inactive, other] }
                    note: { type: string, minLength: 3, maxLength: 500, description: Yalnız audit; perakendeciye gitmez }
      responses:
        '200':
          description: Güncel kayıt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBuyer' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/businesses/{id}/status:
    post:
      tags: [admin]
      summary: "Askıya al / kaldır / sil (F2.18, US-016 AC1–AC3; super_admin, operations)"
      description: >
        Geçişler `BusinessStateMachine` ile (state-machines §9); tablo dışı `409
        INVALID_STATE_TRANSITION`. `suspend` / `unsuspend` her işletmede: kullanıcıları işletme
        bağlamlı uçlarda `403 BUSINESS_SUSPENDED` alır, dizinden düşer; bağlantı, istek ve
        siparişler değişmez (AC1). `archive` (= admin "sil") yalnız perakendecide (değilse `422`):
        geçmişi (bağlantı, bağlantı isteği, engel; sipariş/belge/cari F3–F5) yoksa kayıt ve kişisel
        veri kalıcı silinir (`outcome: deleted`, AC3); varsa arşivlenir, `person_data` silinir,
        açık davetler kapanır, aktif bağlantılar platformca kapanır (`ended_by_side = platform`,
        `end_reason = business_archived`; toptancı adminlerine "bağlantı iptal edildi") (AC2).
        Arşivli veya olmayan işletme `404`. `reason` yalnız audit'te.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [suspend, unsuspend, archive] }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Sonuç
          content:
            application/json:
              schema:
                type: object
                required: [id, outcome, status]
                properties:
                  id: { type: string, format: uuid }
                  outcome: { type: string, enum: [updated, archived, deleted] }
                  status: { type: [string, 'null'], enum: [active, suspended, archived, null], description: Kalıcı silmede null }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/buyers/merge:
    post:
      tags: [admin]
      summary: Mükerrer perakendecileri birleştir (US-016 AC4)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, targetId, reason]
              properties:
                sourceId: { type: string, format: uuid }
                targetId: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '200': { description: Birleştirildi }
  /api/v1/admin/settings:
    get:
      tags: [admin]
      summary: Ayarlar (kapsam ile; US-017, F2.19; platform rolü super_admin)
      description: >
        Kayıttaki (`packages/shared/src/settings.ts`) her anahtar için bu kapsamdaki değer (yoksa
        `null`) ve bu kapsamda değer olmasaydı geçerli olacak miras değer ile kaynağı döner. Miras:
        platform kapsamında kod varsayılanı; plan kapsamında platform → varsayılan; işletme
        kapsamında işletmenin güncel aboneliğinin planı → platform → varsayılan. `scope=platform`
        iken `scopeId` verilmez; `plan` ve `business` için zorunludur. Olmayan plan veya işletme `404`.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [platform, plan, business], default: platform } }
        - { name: scopeId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ayarlar (kayıt sırasıyla)
          content:
            application/json:
              schema:
                type: object
                required: [scope, scopeId, items]
                properties:
                  scope: { type: string, enum: [platform, plan, business] }
                  scopeId: { type: [string, 'null'], format: uuid }
                  items: { type: array, items: { $ref: '#/components/schemas/AdminSettingItem' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      summary: Ayar güncelle (US-017; platform rolü super_admin)
      description: >
        Değer anahtarın tipine, alt/üst sınırına ve çapraz kuralına (`dormant.*`) uymazsa `422
        SETTING_OUT_OF_RANGE` (US-017 AC3). Anahtar bu kapsamda yazılamıyorsa (`scopes`, US-017
        "Kapsam") `422 SETTING_SCOPE_NOT_ALLOWED`. Eski ve yeni değer aynı işlemde audit'e yazılır
        (`setting.updated`, US-017 AC2). Olmayan plan veya işletme `404`. Yanıt, güncellenen
        anahtarın bu kapsamdaki güncel hâlidir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, key, value]
              properties:
                scope: { type: string, enum: [platform, plan, business] }
                scopeId: { type: [string, 'null'], format: uuid }
                key: { type: string }
                value: {}
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettingItem' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/plans:
    get:
      tags: [admin]
      summary: Planlar (yalnız okuma; F2.1a'da toptancı formu için öne alındı, yönetim F6.3)
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminPlan' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: Plan oluştur (US-055)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201': { description: Oluşturuldu }
  /api/v1/admin/subscriptions/{businessId}:
    put:
      tags: [admin]
      summary: Abonelik ata / ödeme işaretle / istisna (US-055)
      parameters: [ { name: businessId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                planId: { type: string, format: uuid }
                markPaid: { type: boolean }
                paymentNote: { type: string }
                overrides: { type: object, additionalProperties: {} }
      responses:
        '200': { description: Güncellendi }
  /api/v1/admin/catalog/{kind}:
    post:
      tags: [admin]
      summary: Genel katalog kaydı oluştur (units, categories, brands, activity-types, regions)
      description: >-
        Unvan ve rol şablonu (`job-titles`, `role-templates`) kendi yollarında tanımlıdır (F2.9).
      parameters: [ { name: kind, in: path, required: true, schema: { type: string, enum: [units, categories, brands, activity-types, regions] } } ]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Oluşturuldu }
  /api/v1/admin/catalog/{kind}/{id}:
    patch:
      tags: [admin]
      summary: Genel katalog kaydı güncelle / pasifleştir
      parameters: [ { name: kind, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Güncellendi }
  /api/v1/admin/catalog/role-templates:
    get:
      tags: [admin]
      summary: Rol şablonları, izinleri ve sürümleriyle (US-012)
      description: Platform rolü `super_admin` veya `content` (F2.9 V1).
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminRoleTemplate' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: Rol şablonu oluştur (US-012 AC1)
      description: >-
        Şablon hiçbir zaman işletme admini değildir. İzinler şablonun yeteneğine ait olmalı ve kapsam
        iznin seçeneklerinden biri olmalı (aksi 422). Aynı işlemde yeteneğin var olan tüm işletmelerine
        rol olarak kopyalanır (F2.9 V4). `code` benzersiz (aksi 422 `code: [taken]`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, capability, permissions]
              properties:
                code: { $ref: '#/components/schemas/CatalogCode' }
                name: { $ref: '#/components/schemas/CatalogName' }
                capability: { type: string, enum: [seller, buyer] }
                permissions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/RolePermission' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleTemplate' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/catalog/role-templates/{id}:
    patch:
      tags: [admin]
      summary: Rol şablonunu güncelle (US-012 AC2)
      description: >-
        İzin listesi değişirse `version` 1 artar, işletmelerin kopyaları değişmez ve şablondan rolü olan
        her arşivlenmemiş işletmenin aktif adminlerine "yeni şablon sürümü" bildirimi gider (outbox
        `role_template.version_published`). Yalnız ad değişikliği sürüm artırmaz (F2.9 V2). İşletme admin
        şablonunun izinleri değişmez (422 `permissions: [admin_template_locked]`, V6). `code` ve
        `capability` değişmez.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/CatalogName' }
                permissions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/RolePermission' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleTemplate' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/catalog/job-titles:
    get:
      tags: [admin]
      summary: Unvanlar, pasifler dahil (US-012)
      description: Platform rolü `super_admin` veya `content` (F2.9 V1). `inUse` silinebilirliği gösterir (AC3).
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminJobTitle' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: Unvan oluştur (US-012 AC1)
      description: >-
        Şablon unvanla aynı yetenekte olmalı (aksi 422 `roleTemplateId: [capability]`). Aktif unvan
        işletmelerin davet ekranında (`GET /team/job-titles`) hemen görünür.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, capability, roleTemplateId]
              properties:
                code: { $ref: '#/components/schemas/CatalogCode' }
                name: { $ref: '#/components/schemas/CatalogName' }
                capability: { type: string, enum: [seller, buyer] }
                roleTemplateId: { type: string, format: uuid }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminJobTitle' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/catalog/job-titles/{id}:
    patch:
      tags: [admin]
      summary: Unvanı güncelle / pasifleştir (US-012 AC3)
      description: >-
        Pasif unvan davet ekranında görünmez; var olan üyelikler etkilenmez. `code` ve `capability`
        değişmez.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/CatalogName' }
                roleTemplateId: { type: string, format: uuid }
                isActive: { type: boolean }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminJobTitle' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      summary: Kullanılmayan unvanı sil (US-012 AC3)
      description: >-
        Bir üyelik (`removed` dahil) veya davet unvanı gösteriyorsa `409 JOB_TITLE_IN_USE`; yalnız
        pasifleştirilebilir (F2.9 V7).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Silindi }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/translations:
    get:
      tags: [admin]
      summary: Arayüz çevirileri ve eksik anahtar raporu
      parameters: [ { name: missing, in: query, schema: { type: boolean } } ]
      responses:
        '200': { description: Liste }
    put:
      tags: [admin]
      summary: Çeviri güncelle (US-058)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key, lang, value]
              properties:
                key: { type: string }
                lang: { $ref: '#/components/schemas/LanguageCode' }
                value: { type: string }
      responses:
        '200': { description: Güncellendi }
  /api/v1/admin/impersonations:
    post:
      tags: [admin]
      summary: Salt-okunur kullanıcı taklidi başlat (US-018)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, targetBusinessId, reason]
              properties:
                targetUserId: { type: string, format: uuid }
                targetBusinessId: { type: string, format: uuid }
                reason: { type: string, minLength: 10 }
      responses:
        '201': { description: Taklit oturumu anahtarları }
  /api/v1/audit-logs:
    get:
      tags: [admin]
      summary: Audit log (işletme admini kendi işletmesi; platform tümü) (US-057)
      parameters: [ { $ref: '#/components/parameters/BusinessIdOptional' }, { name: action, in: query, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date-time } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: Liste }

  # ---------------------------------------------------------------- dev only
  /api/v1/dev/sms-outbox:
    get:
      tags: [dev]
      summary: Mock SMS kutusu — yalnızca development ve staging (NFR-96). Production'da 404.
      security: []
      parameters: [ { name: phone, in: query, schema: { $ref: '#/components/schemas/PhoneE164' } } ]
      responses:
        '200': { description: Son 50 mesaj }
  /api/v1/dev/storage:
    put:
      tags: [dev]
      summary: Yerel dosya deposuna yükleme (STORAGE_PROVIDER=local, ADR-0023) — production'da yok
      description: |
        `token` (sorgu parametresi), `local` deposunun ürettiği imzalı (HMAC) ve süreli yükleme bağlantısıdır. İmza veya süre
        geçersizse, Content-Type ya da gövde boyutu imzadakinden farklıysa veya nesne zaten yazılmışsa
        (tek yazım, R2'de `If-None-Match: *`) 403.
      security: []
      parameters: [ { name: token, in: query, required: true, schema: { type: string } } ]
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Yüklendi }
        '403': { $ref: '#/components/responses/Error' }
    get:
      tags: [dev]
      summary: Yerel dosya deposundan okuma (imzalı, süreli) — production'da yok
      security: []
      parameters: [ { name: token, in: query, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Dosya içeriği
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BusinessId:
      name: X-Business-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    BusinessIdOptional:
      name: X-Business-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    XClient:
      name: X-Client
      in: header
      required: false
      description: >-
        `web` → yenileme anahtarı yanıt gövdesinde dönmez, `b2b_rt` httpOnly cookie'sine yazılır
        (ADR-0006 madde 3, TM-04; F1.13a). Mobil başlığı göndermez; davranışı değişmez.
      schema: { type: string, enum: [web] }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: false
      description: >-
        Cookie ile yenilemede zorunlu (boş olmayan herhangi bir değer; web `fetch` gönderir); yoksa
        anahtar tüketilmeden `401 UNAUTHENTICATED` (CSRF, TM-21; F1.13a).
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 64 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    SetRefreshCookie:
      description: >-
        Yalnızca web (`X-Client: web` veya cookie ile yenileme):
        `b2b_rt=<anahtar>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=<auth.refresh_token_days>`.
        `Domain` yok; web API'yi kendi kökeninden çağırır (Next rewrite). Silme: aynı bayraklarla
        `b2b_rt=; Max-Age=0`.
      schema: { type: string }
  responses:
    Error:
      description: Hata
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: Accept-Language dilinde }
        requestId: { type: string }
        details:
          type: object
          description: "Örn. alan hataları { field: [mesaj] }, retryAfter, available"
          additionalProperties: {}
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - PERMISSION_DENIED
        - CAPABILITY_REQUIRED
        - NOT_FOUND
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_CONFLICT
        - RATE_LIMITED
        - CONFIRMATION_REQUIRED
        - OTP_RATE_LIMITED
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_LOCKED
        - SMS_UNAVAILABLE
        - TOTP_REQUIRED
        - TOTP_INVALID
        - REFRESH_TOKEN_REUSED
        - USER_DISABLED
        - BUSINESS_SUSPENDED
        - SUBSCRIPTION_READ_ONLY
        - ENTITLEMENT_LIMIT_REACHED
        - VOEN_INVALID
        - VOEN_ALREADY_REGISTERED
        - VOEN_REQUIRED
        - SELLER_APPLICATION_ALREADY_PENDING
        - PHONE_ALREADY_REGISTERED
        - LAST_ADMIN_PROTECTED
        - MEMBER_ALREADY_EXISTS
        - CONNECTION_ALREADY_ACTIVE
        - CONNECTION_REQUEST_ALREADY_PENDING
        - CONNECTION_REQUEST_EXPIRED
        - CONNECTION_BLOCKED
        - CONNECTION_COOLDOWN_ACTIVE
        - CONNECTION_DAILY_QUOTA_EXCEEDED
        - CONNECTION_NOT_ACTIVE
        - PRICE_NOT_AVAILABLE
        - QTY_NOT_MULTIPLE
        - BELOW_MIN_ORDER_QTY
        - BELOW_MIN_ORDER_AMOUNT
        - VARIANT_UNAVAILABLE
        - CURRENCY_MISMATCH
        - STOCK_INSUFFICIENT
        - ORDER_QTY_INCREASE_NOT_ALLOWED
        - ORDER_EMPTY_USE_REJECT
        - DELIVERY_PHOTO_REQUIRED
        - DELIVERY_TIMESTAMP_TOO_OLD
        - FILE_INVALID
        - IMPORT_TOO_MANY_ROWS
        - SETTING_OUT_OF_RANGE
        - SETTING_SCOPE_NOT_ALLOWED
        - JOB_TITLE_IN_USE
        - INTERNAL_ERROR
    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      examples: ['+994501234567']
    Voen:
      type: string
      pattern: '^[0-9]{9}[12]$'
    LanguageCode:
      type: string
      enum: [az, ru, tr, en]
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [AZN]
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,4})?$'
      examples: ['12.50']
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/Decimal' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    ActivityType:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedText' }
        sortOrder: { type: integer }
    Region:
      type: object
      required: [id, countryCode, parentId, type, name]
      properties:
        id: { type: string, format: uuid }
        countryCode: { type: string, pattern: '^[A-Z]{2}$', examples: [AZ] }
        parentId: { type: [string, 'null'], format: uuid, description: Rayonun bağlı olduğu şehir }
        type: { type: string, enum: [city, district] }
        name: { $ref: '#/components/schemas/LocalizedText' }
    LocalizedText:
      type: object
      properties:
        az: { type: string }
        ru: { type: string }
        tr: { type: string }
        en: { type: string }
      minProperties: 1
    DeviceInfo:
      type: object
      properties:
        type: { type: string, enum: [web, ios, android] }
        name: { type: string }
        appVersion: { type: string }
    TokenPair:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: saniye (900) }
        refreshToken: { type: string, description: Yalnızca mobil; web'de cookie }
    AuthResult:
      type: object
      description: >-
        nextStep = none iken accessToken ve expiresIn dolu (oturum açıldı). nextStep = register iken
        oturum açılmaz; accessToken yok, pendingToken kayıt için kısa ömürlü anahtardır (F1.5b).
      required: [nextStep, memberships]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: saniye (900) }
        refreshToken: { type: string, description: Yalnızca mobil; web'de cookie }
        nextStep: { type: string, enum: [none, register, totp, totp_setup] }
        pendingToken:
          type: string
          description: >-
            nextStep = register (kayıt, F2.3; telefonu taşır, 15 dk) veya totp / totp_setup (yalnızca
            /auth/totp/* uçlarında geçerli ön oturum, F1.6) ise. Erişim anahtarı olarak kabul edilmez.
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceType: { type: string }
        deviceName: { type: string }
        city: { type: string }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    MembershipSummary:
      type: object
      properties:
        membershipId: { type: string, format: uuid, description: F1.8b }
        businessId: { type: string, format: uuid }
        businessName: { type: string }
        businessStatus:
          type: string
          enum: [active, suspended, dormant, archived]
          description: "F1.8b: askıdaki / arşivli işletme listede görünür ama işletme bağlamlı uçlar 403 BUSINESS_SUSPENDED döner"
        capability: { type: string, enum: [seller, buyer] }
        roleName: { type: string }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        preferredLanguage: { $ref: '#/components/schemas/LanguageCode' }
        timezone: { type: [string, 'null'] }
        platformRole: { type: [string, 'null'] }
        totpEnabled: { type: boolean, description: TOTP kurulu ve etkin mi (F1.6) }
        twoFactorRecommended:
          type: boolean
          description: "Kullanıcının aktif bir işletme admini üyeliği var ve TOTP kurulu değil (US-002 AC3, F1.8b)"
        memberships: { type: array, items: { $ref: '#/components/schemas/MembershipSummary' } }
        lastBusinessId:
          type: [string, 'null']
          format: uuid
          description: "Son kullanılan işletme; aktif üyeliği kalmadıysa null (US-003 AC1, F2.7). İstemci işletme seçicide varsayılan alır."
        activeBusiness:
          type: object
          properties:
            id: { type: string, format: uuid }
            capability:
              type: [string, 'null']
              enum: [seller, buyer, null]
              description: "Rolün yeteneği, işletmede onaylıysa. Yetenek onaylı değilse (beklemede / askıda) null; bu durumda işletme bağlamlı uçlar 403 CAPABILITY_REQUIRED döner (F1.8b)."
            timezone: { type: string }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
            permissions:
              type: array
              items: { $ref: '#/components/schemas/RolePermission' }
            subscriptionStatus: { type: string }
    TeamMember:
      type: object
      required: [id, userId, fullName, phone, roleId, jobTitleId, branchId, warehouseId, regionIds, isBusinessAdmin, isSelf, joinedAt]
      properties:
        id: { type: string, format: uuid, description: Üyelik kimliği }
        userId: { type: string, format: uuid }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        roleId: { type: string, format: uuid }
        jobTitleId: { type: string, format: uuid }
        branchId: { type: [string, 'null'], format: uuid }
        warehouseId: { type: [string, 'null'], format: uuid }
        regionIds: { type: array, items: { type: string, format: uuid } }
        isBusinessAdmin: { type: boolean }
        isSelf: { type: boolean }
        joinedAt: { type: [string, 'null'], format: date-time }
    TeamInvitation:
      type: object
      required: [id, phone, roleId, jobTitleId, branchId, warehouseId, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        roleId: { type: string, format: uuid }
        jobTitleId: { type: string, format: uuid }
        branchId: { type: [string, 'null'], format: uuid }
        warehouseId: { type: [string, 'null'], format: uuid }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    TeamRole:
      type: object
      required: [id, name, capability, isBusinessAdmin, sourceTemplateId, isCustom, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalizedText' }
        capability: { type: string, enum: [seller, buyer] }
        isBusinessAdmin: { type: boolean }
        sourceTemplateId: { type: [string, 'null'], format: uuid }
        isCustom: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/RolePermission' } }
    RoleTemplate:
      type: object
      required: [id, code, name, capability, permissions]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        capability: { type: string, enum: [seller, buyer] }
        permissions: { type: array, items: { $ref: '#/components/schemas/RolePermission' } }
    RoleName:
      description: Özel rol adı; en az bir dil, her biri 1–80 karakter.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        az: { type: string, minLength: 1, maxLength: 80 }
        ru: { type: string, minLength: 1, maxLength: 80 }
        tr: { type: string, minLength: 1, maxLength: 80 }
    JobTitle:
      type: object
      required: [id, code, name, capability, roleTemplateId]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        capability: { type: string, enum: [seller, buyer] }
        roleTemplateId: { type: [string, 'null'], format: uuid }
    CatalogCode:
      description: Benzersiz kod (seed eşleşme anahtarı); sonradan değişmez (F2.9 V5).
      type: string
      pattern: '^[a-z][a-z0-9_]{2,62}$'
    CatalogName:
      description: Katalog adı; az, ru, tr zorunlu, en isteğe bağlı (ADR-0007); her biri 1–80 karakter.
      type: object
      additionalProperties: false
      required: [az, ru, tr]
      properties:
        az: { type: string, minLength: 1, maxLength: 80 }
        ru: { type: string, minLength: 1, maxLength: 80 }
        tr: { type: string, minLength: 1, maxLength: 80 }
        en: { type: string, minLength: 1, maxLength: 80 }
    AdminRoleTemplate:
      type: object
      required: [id, code, name, capability, isBusinessAdmin, version, permissions, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        capability: { type: string, enum: [seller, buyer] }
        isBusinessAdmin: { type: boolean, description: 'true ise izinleri değişmez (V6)' }
        version: { type: integer, minimum: 1 }
        permissions: { type: array, items: { $ref: '#/components/schemas/RolePermission' } }
        updatedAt: { type: string, format: date-time }
    AdminJobTitle:
      type: object
      required: [id, code, name, capability, roleTemplateId, isActive, inUse]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        capability: { type: string, enum: [seller, buyer] }
        roleTemplateId: { type: [string, 'null'], format: uuid }
        isActive: { type: boolean }
        inUse: { type: boolean, description: 'Üyelik veya davet gösteriyor; silinemez (AC3)' }
    RolePermission:
      type: object
      required: [code, scope]
      properties:
        code: { type: string, examples: [orders.approve] }
        scope: { type: string, enum: [all, branch, warehouse, assigned] }
    Business:
      type: object
      properties:
        id: { type: string, format: uuid }
        legalName: { type: string }
        voen: { type: [string, 'null'] }
        legalType: { type: [string, 'null'] }
        regionId: { type: string, format: uuid }
        addressLine: { type: [string, 'null'] }
        businessPhone: { type: [string, 'null'] }
        logoUrl: { type: [string, 'null'] }
        logoFileId: { type: [string, 'null'], format: uuid }
        contactName:
