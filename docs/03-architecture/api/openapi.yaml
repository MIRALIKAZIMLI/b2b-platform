  /api/v1/i18n/{lang}:
    get:
      tags: [system]
      summary: Arayüz çevirileri (önbelleklenebilir, ETag; US-058, F1.3)
      description: |
        Dilin bütün arayüz anahtarları. Dilde eksik olan anahtar varsayılan dilin (az) değeriyle
        gelir (US-058 AC3). Yanıt `Cache-Control: no-cache` taşır: istemci önbelleğini her
        kullanımda `If-None-Match` ile doğrular; değişiklik yoksa `304`.
      security: []
      parameters:
        - name: lang
          in: path
          required: true
          description: |
            Dil kodu. `languages` tablosunda olmayan (ör. `xx`) veya pasif (`is_active = false`)
            dil `404 NOT_FOUND` döner; bu yüzden şema enum değildir.
          schema: { type: string, examples: [az, ru, tr] }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Anahtar → metin sözlüğü
          headers:
            ETag: { description: Sözlüğün sürüm özeti (güçlü ETag), schema: { type: string } }
            Cache-Control: { schema: { type: string, examples: [no-cache] } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
        '304':
          description: İstemcideki sürüm güncel (gövde yok)
          headers:
            ETag: { schema: { type: string } }
        '404': { $ref: '#/components/responses/Error' }
