# CI hattı — docs/06-operations/environments-cicd.md §3
# Üçüncü taraf action'lar commit SHA ile sabitlenir (yorumda sürüm).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks CLI resmî container imajıyla çalışır (lisans anahtarı gerekmez).
      - name: gitleaks
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo "$GITLEAKS_IMAGE"
          git --redact --verbose --exit-code 1 .

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testler + kapsam raporu (yalnızca yazdırılır; eşik F1.5a'da).
      - run: pnpm test:coverage
      - run: pnpm exec vitest run

  # Sıra: db:bootstrap → db:migrate → check-rls (F1.1b) → entegrasyon/izolasyon testleri (F1.1a).
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2b_ci_password
          POSTGRES_DB: b2b_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U b2b -d b2b_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Servis container'ının süper kullanıcısı (yalnızca CI). test/db.ts her çalıştırmada
      # boş bir test veritabanı açar, rolleri rastgele şifreyle hazırlar, migration'ları
      # migrator ile uygular ve testleri app_user ile çalıştırır.
      TEST_DATABASE_ADMIN_URL: postgres://b2b:b2b_ci_password@127.0.0.1:5432/b2b_test
      # Sunucu ortam şeması REDIS_URL'i zorunlu tutar (F1.2a); servis container'ı.
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # F1.1b: migration'lar servis veritabanına (b2b_test) sıfırdan uygulanır ve check-rls
      # RLS sınıfı/politikası eksik tabloda işi kırar. Rol şifreleri her çalıştırmada rastgele
      # üretilir ve GITHUB_ENV'e yazılmadan önce maskelenir; hiçbir adım adres/şifre yazdırmaz.
      - name: Rol şifreleri (rastgele, maskeli)
        run: |
          APP_PW="$(openssl rand -hex 24)"
          MIGRATOR_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$APP_PW"
          echo "::add-mask::$MIGRATOR_PW"
          {
            echo "DATABASE_URL=postgres://app_user:$APP_PW@127.0.0.1:5432/b2b_test"
            echo "DATABASE_MIGRATOR_URL=postgres://migrator:$MIGRATOR_PW@127.0.0.1:5432/b2b_test"
          } >> "$GITHUB_ENV"
      - name: db:bootstrap
        run: pnpm db:bootstrap
        env:
          APP_ENV: test
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2b_ci_password
      - name: db:migrate
        run: pnpm db:migrate
      - name: check-rls
        run: pnpm check-rls
      - run: pnpm test:integration

  # İskelet: içi F1.12'de dolar (üretilen OpenAPI = docs/03-architecture/api/openapi.yaml).
  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "contract işi iskelet; F1.12'de doldurulacak."

  deps-audit:
    name: deps-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Önbellek yok: pnpm audit yalnızca pnpm-lock.yaml'ı okur, paket kurmaz.
      # (Kurulum olmadan önbellek açılırsa "Path Validation Error" verir.)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level=high

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
